lifecycle: draft
planId: agentic-systems-research-and-learning
revision: 1
tasks:
  - acceptanceCriteria:
      - The target reader profile and prerequisites are explicit.
      - The curriculum states what the reader will understand and build by the end.
      - New terms are introduced before they are used and collected in a glossary.
      - The scope distinguishes agentic systems from chatbots, workflows, and conventional automation.
    description: Establish the assumed background, terminology policy, prerequisites, and measurable outcomes for a new developer learning agentic systems.
    id: define-audience-and-outcomes
    title: Define the learner and learning outcomes
    validationIntent: Review the learner profile and outcomes with a newcomer and confirm that no unexplained prerequisite knowledge is assumed.
  - acceptanceCriteria:
      - Claims are backed by primary sources or authoritative technical documentation.
      - A comparison table covers chatbots, chains, workflows, single agents, and multi-agent systems.
      - The research explains the observe-orient-decide-act loop and common variants.
      - Open questions and disputed terminology are clearly labeled.
    description: Build a source-backed foundation covering agents, environments, observations, actions, goals, policies, reasoning loops, autonomy levels, and the differences among deterministic workflows, LLM workflows, and agents.
    id: research-foundations
    title: Research core agentic-system foundations
    validationIntent: Perform a citation audit and have each foundational concept explained in plain language and precise technical language.
  - acceptanceCriteria:
      - Each pattern includes intent, structure, strengths, failure modes, and appropriate use cases.
      - Architecture diagrams show control flow, data flow, and state boundaries.
      - Pattern selection guidance favors the least autonomous design that satisfies the requirement.
      - At least one concrete example accompanies every major pattern.
    description: Study common architectures including tool-using agents, planner-executor systems, routing, reflection, evaluator-optimizer loops, retrieval-augmented agents, event-driven agents, and multi-agent coordination.
    id: research-architectures
    title: Research architectures and design patterns
    validationIntent: Compare the patterns against representative use cases and verify that a reader can explain why one architecture is preferable to another.
  - acceptanceCriteria:
      - Tool schemas and structured-output contracts include valid and invalid examples.
      - Memory guidance distinguishes conversational state, working memory, episodic records, semantic retrieval, and durable application data.
      - Planning guidance compares plan-first, incremental, and reactive approaches.
      - Context-window limits, compaction, provenance, and stale-memory risks are addressed.
    description: 'Explain the components that make agents useful: model selection, prompts, structured outputs, tool contracts, state, short- and long-term memory, retrieval, planning, context management, and human checkpoints.'
    id: research-agent-components
    title: Research tools memory planning and context
    validationIntent: Implement small probes for tool invocation, structured output validation, memory retrieval, and plan execution, then document observed behavior.
  - acceptanceCriteria:
      - A threat model covers untrusted input, tools, retrieved content, credentials, and external side effects.
      - Reliability guidance includes retries, timeouts, idempotency, budgets, circuit breakers, and graceful degradation.
      - Evaluation guidance includes task success, trajectory quality, tool correctness, safety, cost, and latency.
      - Examples demonstrate approval gates and least-privilege tool access.
    description: Investigate failure modes and controls including hallucinated actions, prompt injection, excessive agency, privilege boundaries, data leakage, loops, non-determinism, cost, latency, observability, evaluation, and human approval.
    id: research-reliability-and-safety
    title: Research evaluation reliability and safety
    validationIntent: Run adversarial scenarios against example agents and verify that controls prevent or clearly surface unsafe and unreliable behavior.
  - acceptanceCriteria:
      - A numbered reading path begins with a start-here page and ends with a capstone.
      - Every chapter declares prerequisites, objectives, key concepts, an example, an exercise, a summary, and next steps.
      - Concepts and code examples are cross-referenced through stable identifiers.
      - The system supports both linear reading and topic-based lookup.
      - A glossary, architecture pattern catalog, troubleshooting guide, and source index are included.
    description: Create an ordered documentation architecture in which every chapter builds on prior concepts and uses consistent sections, cross-links, checkpoints, and progressive examples.
    id: design-serialized-doc-system
    title: Design the serialized documentation system
    validationIntent: Conduct a navigation walkthrough from start to finish and verify that links, prerequisites, numbering, and concept progression remain coherent.
  - acceptanceCriteria:
      - Chapter 01 explains what makes a system agentic using familiar examples.
      - Chapter 02 traces one complete agent loop step by step.
      - Chapter 03 implements a deterministic tool-using agent with explicit state.
      - Every chapter includes annotated code, expected output, and a reader exercise.
      - The minimal example runs without external infrastructure beyond documented prerequisites.
    description: Produce the first serialized chapters introducing agentic thinking, the agent loop, environment and state, tool calls, structured outputs, and a minimal single-agent implementation.
    id: write-foundation-series
    title: Write the beginner foundation series
    validationIntent: Ask a new reader to run the examples in order and record setup friction, conceptual confusion, and discrepancies between expected and actual output.
  - acceptanceCriteria:
      - Each chapter starts from a previously working example and introduces one major concept.
      - Examples include a support-ticket router, research planner, retrieval assistant, evaluator loop, and supervised specialist team.
      - Each implementation explains state transitions and termination conditions.
      - Tradeoffs are demonstrated with counterexamples showing when not to use the pattern.
    description: Produce intermediate chapters that evolve the minimal agent into routing, planning and execution, retrieval, reflection, and supervised multi-agent designs.
    id: write-pattern-series
    title: Write the architecture pattern series
    validationIntent: Run every example and compare its behavior with a simpler baseline to verify that the added complexity delivers a measurable benefit.
  - acceptanceCriteria:
      - Examples include a deterministic loop, calculator tool, structured extraction, web research mock, memory retrieval, planner-executor, approval-gated action, and multi-agent handoff.
      - Every example provides setup steps, input, expected output, tests, and common failure notes.
      - External services are isolated behind adapters and can be replaced by local fakes.
      - Examples expose traces so readers can inspect decisions, tool calls, state changes, and stopping conditions.
      - Security-sensitive examples use synthetic data and non-destructive tools.
    description: Create small, framework-light examples that share conventions and grow from a pure state machine to a guarded research agent and a capstone agentic application.
    id: build-example-suite
    title: Build a progressive runnable example suite
    validationIntent: Execute the complete example suite from a clean environment and verify tests, expected outputs, deterministic fixtures, and trace readability.
  - acceptanceCriteria:
      - Chapters cover schema validation, idempotent tools, durable state, concurrency control, retries, timeouts, budgets, and cancellation.
      - Security coverage includes prompt injection defenses, sandboxing, authorization, secret handling, and audit logs.
      - Observability coverage includes traces, structured events, metrics, replay, and incident diagnosis.
      - Evaluation coverage includes offline fixtures, simulation, regression suites, and online monitoring.
      - A production-readiness checklist summarizes launch requirements.
    description: Teach readers how to move from prototypes to dependable systems through contracts, persistence, queues, concurrency, security, observability, evaluation, deployment, and operational controls.
    id: write-production-series
    title: Write production engineering chapters
    validationIntent: Apply the production checklist to the capstone and demonstrate at least one detected failure for each major control category.
  - acceptanceCriteria:
      - The capstone has explicit goals, budgets, tool permissions, state transitions, and termination rules.
      - Sources and claims are linked through provenance records.
      - The agent supports pause, resume, cancellation, and human review.
      - Automated evaluations cover successful research, missing evidence, malicious content, tool failure, looping, and budget exhaustion.
      - The final walkthrough maps capstone components back to earlier chapters.
    description: Create a bounded research agent that decomposes a question, gathers approved sources, records provenance, synthesizes findings, requests approval for consequential actions, and emits an auditable report.
    id: build-capstone
    title: Build the capstone research agent
    validationIntent: Run the capstone against normal and adversarial scenarios, inspect its traces and report, and verify that all safety and completion conditions hold.
  - acceptanceCriteria:
      - All examples pass automated checks from a clean setup.
      - Every technical claim has an appropriate source or is labeled as an informed recommendation.
      - At least one newcomer completes the linear path and capstone with recorded feedback.
      - Terminology, diagrams, code style, and chapter structure are consistent.
      - Broken links, stale dependencies, ambiguous instructions, and unexplained outputs are resolved.
    description: Review technical accuracy, instructional progression, accessibility, example reproducibility, source quality, and newcomer comprehension before publication.
    id: editorial-and-learner-validation
    title: Validate the complete learning experience
    validationIntent: Run automated documentation checks, a clean-room example build, expert technical review, and a moderated newcomer usability test.
version: '1'
