description: Build a simple, production-quality todo web application. Users must be able to add todos, edit todo text, mark each todo complete or incomplete, delete todos, and filter the list by All, Active, and Completed. Todos and completion state must persist locally across reloads. The UI must be responsive and accessible, including keyboard operation, visible focus, semantic labels, and sensible empty states. Validate the complete happy path end to end through Appraise-managed browser validation.
