description: Create a small local-first notes app in /Users/jamil/Personal Projects/simple-notes using React, TypeScript, Vite, plain CSS, and browser localStorage. The app should let a user create, view, edit, delete, and search notes; preserve notes across refreshes; show notes ordered by most recently updated first; provide clear empty states and validation for note title/content; and include practical implementation verification such as build/test checks and a browser smoke test.
