lifecycle: validation_changes_requested
planId: pln_01kwj043361rs4ha2rx6b91n3s
revision: 2
tasks:
  - acceptanceCriteria:
      - The target workspace contains a Vite + React 19 + TypeScript app structure with `npm` scripts for development, build, lint, and preview or their nearest project equivalents.
      - Tailwind CSS is configured for the app source paths and shadcn/ui is initialized with a working component alias setup.
      - The app renders a polished responsive shell without missing dependency, CSS, or module-resolution errors.
    description: Create a Vite React application using the TypeScript template, target React 19, configure Tailwind CSS and shadcn/ui, and add the minimal component primitives needed for the todo interface such as Button, Input, Checkbox, Card or section containers, Badge, and Alert.
    id: scaffold-setup
    title: Scaffold a React 19 TypeScript app with Tailwind and shadcn/ui
    validationIntent: Install dependencies, run the scaffold build, and verify the generated app can render locally.
  - acceptanceCriteria:
      - Users create todos through an always-visible inline form with a text input and submit button, not through a modal.
      - Submitting a non-empty title creates a todo, clears the input, focuses the input again, and shows validation feedback for empty or whitespace-only titles.
      - The list exposes all, active, and completed views with clear empty states for a first-time user and for filtered views with no matches.
    description: Define a TypeScript `Todo` model with id, title, completed, createdAt, and updatedAt fields. Build the main shadcn-based interface with an inline add-todo form at the top of the list, list rows below it, filter controls for all/active/completed, an item count, and clear empty states.
    id: task-model-ui
    title: Define todo state and build the primary interface
    validationIntent: Verify the form interaction, empty states, focus behavior, and filters through user-facing tests or manual browser checks.
  - acceptanceCriteria:
      - Each todo can be marked completed or active with an accessible checkbox control and immediate visual update.
      - Each todo can be edited inline, with save/cancel behavior, whitespace validation, and updatedAt refresh on save.
      - Each todo can be deleted from any filter view without breaking counts, filters, or keyboard navigation.
    description: Add accessible row controls for toggling completion, editing a title inline, saving/canceling edits, and deleting todos with predictable state transitions and no stale list rendering.
    id: crud-completion
    title: Implement todo editing, deletion, and completion controls
    validationIntent: Exercise create, edit, delete, complete, and reactivate flows with focused interaction tests or a manual browser checklist.
  - acceptanceCriteria:
      - Todos survive page reloads and browser restarts when localStorage is available.
      - Malformed or incompatible localStorage data is ignored safely, the user starts with an empty list, and the app does not crash.
      - If a localStorage write fails because storage is unavailable, full, blocked, or throws, the app keeps the latest in-memory changes visible, shows a non-blocking shadcn Alert that changes are not saved locally, and retries persistence on the next successful todo change or reload opportunity.
      - A failed persistence attempt never marks a todo as saved when it has not been written successfully.
    description: Persist the todo collection to localStorage under a versioned key, load it on startup, tolerate malformed stored data, and make localStorage write failures visible without losing the in-memory task list.
    id: persistence
    title: Persist todos and handle localStorage sync failures
    validationIntent: Cover normal persistence, reload restoration, malformed data recovery, and simulated localStorage setItem failure.
  - acceptanceCriteria:
      - Build and lint checks pass or any unavoidable gaps are documented with exact commands and failure output.
      - Automated or manual validation covers adding a todo via the inline form, editing it, completing/reactivating it, deleting it, filtering views, reloading persisted data, and simulating a localStorage write failure.
      - The final implementation notes include the local dev URL, validation commands run, and any remaining risks.
    description: Add and run validation that covers app startup, responsive rendering, create/edit/delete/complete workflows, filters, localStorage persistence, and persistence-failure messaging.
    id: validation
    title: Validate the planned todo workflow
    validationIntent: Run the focused app validation suite plus build/lint checks appropriate for the created React TypeScript app.
version: "1"
