description: Create a simple todo application in /Users/jamil/Personal Projects/simple-todo-6 using Vite, React 19, TypeScript, Tailwind CSS, and shadcn/ui. The app should provide a responsive task manager with an inline creation form, editable todo rows, completion toggles, filtering, localStorage persistence across browser sessions, graceful persistence-failure recovery, and validation coverage for the core user workflow. AppraiseJS owns the plan lifecycle and review gate before implementation proceeds.
