tasks:
  - acceptanceCriteria:
      - The app starts locally and renders a named Thoughtless shell.
      - The project has working development and production build scripts.
      - The layout adapts cleanly to narrow and wide viewports.
    description: Create a maintainable Vite React TypeScript application with local development, build, and test scripts plus the basic responsive app shell.
    id: task-1
    title: Bootstrap the React application
    validationIntent: Verify the app loads, displays the Thoughtless heading, and has no horizontal overflow at desktop and mobile viewports.
  - acceptanceCriteria:
      - Thoughts have stable IDs, text, and creation/update timestamps.
      - Thoughts survive a page reload in the same browser.
      - Malformed or missing local data results in a usable empty state.
    description: Implement a typed thought model and a defensive localStorage repository that loads saved thoughts, saves changes, and handles malformed stored data without crashing.
    id: task-2
    title: Model and persist thoughts
    validationIntent: Create a thought, reload, and verify it remains visible; verify the empty state is usable on a clean profile.
  - acceptanceCriteria:
      - A non-empty thought can be created from the composer.
      - Blank-only thoughts are rejected with understandable feedback.
      - New thoughts appear immediately in a readable list with their content and actions.
    description: Add an accessible composer and thought list with clear empty, populated, and validation states.
    id: task-3
    title: Create and display thoughts
    validationIntent: Create a thought through labeled controls, assert the content appears, and confirm blank submission cannot create an item.
  - acceptanceCriteria:
      - An existing thought can be edited and the updated text persists.
      - A thought can be deleted through an explicit confirmation step.
      - Canceling edit or deletion leaves the thought unchanged.
      - Focus returns to a sensible control after each operation.
    description: Support inline or dialog-based editing and guarded deletion while retaining keyboard usability and predictable focus.
    id: task-4
    title: Edit and delete thoughts
    validationIntent: Create, edit, cancel an edit, confirm deletion, cancel deletion, and verify visible text and focus behavior.
  - acceptanceCriteria:
      - Search filters thoughts case-insensitively by content.
      - Users can switch between all thoughts and a recent subset.
      - A no-results state explains the active query/filter and offers a reset.
      - Clearing search and filters restores the full list.
    description: Add immediate text search and useful all/recent filtering with a clear reset path and result feedback.
    id: task-5
    title: Search and filter thoughts
    validationIntent: Seed multiple thoughts, search for one, exercise the recent filter, confirm no-results feedback, and reset to all results.
  - acceptanceCriteria:
      - All interactive controls are keyboard reachable with visible focus.
      - Inputs and icon actions have programmatic names; dynamic results are announced appropriately.
      - Color contrast and responsive spacing support comfortable use.
      - Core flows work at mobile and desktop widths without horizontal scrolling.
    description: Apply a cohesive visual system, visible focus styles, accessible names and status announcements, motion-safe feedback, and final responsive behavior.
    id: task-6
    title: Polish accessibility and responsive UX
    validationIntent: Exercise the core flow by keyboard, inspect accessible names and live status, and assert no horizontal overflow at representative mobile and desktop viewports.
version: "1"
