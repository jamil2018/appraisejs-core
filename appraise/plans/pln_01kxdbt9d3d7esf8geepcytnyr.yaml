description: Build a simple, accessible browser-based notes app in this empty workspace. Use React, TypeScript, and Vite. Users can create notes with a required title and optional body, edit an existing note, delete a note with confirmation, search notes by title or body, and retain notes after page reload using localStorage. Include an empty state, clear validation feedback, keyboard-accessible controls, responsive styling, unit/component tests, and Appraise-compatible Cucumber/Playwright validation artifacts. Keep the implementation intentionally small and production-quality.
