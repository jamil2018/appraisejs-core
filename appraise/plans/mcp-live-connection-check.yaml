edges:
  - from: verify-mcp-connection
    to: verify-plan-review-page
    type: depends-on
goal: Verify the MCP plan review flow
description: Verify that Codex can connect to AppraiseJS through MCP, publish a plan, and view its review page in the application.
implementationGroups:
  - id: mcp-verification
    taskIds:
      - verify-mcp-connection
      - verify-plan-review-page
lifecycle: awaiting_plan_review
planId: mcp-live-connection-check
revision: 1
tasks:
  - acceptanceCriteria:
      - The MCP server accepts a plan creation request.
    description: Connect to the configured AppraiseJS MCP server and confirm plan tools respond.
    id: verify-mcp-connection
    title: Verify MCP connection
    validationIntent: Capture the successful MCP tool response.
  - acceptanceCriteria:
      - The AppraiseJS plan page displays the plan goal and tasks.
    description: Open the durable plan review route in AppraiseJS and confirm the plan content renders.
    id: verify-plan-review-page
    title: Verify plan review page
    validationIntent: Inspect the plan page in a real browser.
version: '1'
