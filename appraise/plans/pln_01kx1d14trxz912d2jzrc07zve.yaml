description: |-
  Build an app called IdeaMade that lets users write up their ideas in a notepad-style format. The first screen should be the usable note-taking experience, not a marketing page. It should feel focused and simple: a clean editor for idea notes, lightweight title/summary metadata, autosave to local storage, a list or sidebar of saved ideas, create/rename/delete flows, and basic empty/error states. The app should work as a modern frontend application suitable for this empty workspace, with a clear implementation plan, sensible file structure, and validation that proves users can create, edit, persist, switch between, and delete idea notes.

  Target workspace is an empty writable directory at /Users/jamil/Personal Projects/ideamade. Prefer a small modern React/Vite/TypeScript app unless Appraise selects a better local fit. Treat localStorage persistence as sufficient for the first version. Include accessible controls, responsive layout, and Appraise-owned validation artifacts suitable for later Playwright/Cucumber execution.
edges:
  - from: scaffold-setup
    to: editor-state
    type: blocks
  - from: editor-state
    to: document-management
    type: blocks
  - from: document-management
    to: persistence
    type: blocks
  - from: persistence
    to: validation
    type: blocks
goal: IdeaMade
implementationGroups:
  - id: foundation
    taskIds:
      - scaffold-setup
      - editor-state
  - id: behavior
    taskIds:
      - document-management
      - persistence
  - id: quality
    taskIds:
      - validation
lifecycle: failed_validation
planId: pln_01kx1d14trxz912d2jzrc07zve
revision: 1
tasks:
  - acceptanceCriteria:
      - The app starts locally with React 19, TypeScript, Vite, and local browser validation and no missing dependency errors.
      - Base styling, component primitives, and project structure are in place for the planned UI.
      - Stack assumptions are stated clearly in the review-ready plan.
    description: Create the React 19, TypeScript, Vite, and local browser validation application foundation, install required UI/data dependencies, and wire the base layout, routing, and styling entry points requested by the brief. These defaults are reviewable through Appraise feedback when the brief does not name a stack.
    id: scaffold-setup
    title: Scaffold and configure the app shell
    validationIntent: Run install/build or the closest available scaffold validation for the generated app shell.
  - acceptanceCriteria:
      - Users can create or update written content through the primary editor.
      - Unsaved, saved, empty, and invalid states are represented clearly.
    description: Create the document or note editing experience, including editing state, selection affordances, and save-ready UI feedback.
    id: editor-state
    title: Build editor state and controls
    validationIntent: Exercise editor state transitions with focused component or browser validation.
  - acceptanceCriteria:
      - Users can move between document list and editor surfaces without losing context.
      - Document management actions update the visible state predictably.
    description: Add the list/detail workflow for creating, selecting, renaming, deleting, or organizing documents as requested by the brief.
    id: document-management
    title: Manage documents or notes
    validationIntent: Verify the document/list workflow and destructive action safeguards.
  - acceptanceCriteria:
      - Saved content survives a page reload or app restart according to the selected persistence layer.
      - Persistence failures surface a recoverable state without corrupting visible content.
    description: Store document content with the persistence layer requested by the brief and restore it on reload.
    id: persistence
    title: Persist editor content
    validationIntent: Verify saved content reloads and persistence failures are handled.
  - acceptanceCriteria:
      - The primary editor workflow is verified with deterministic evidence.
      - Relevant lint, unit, component, or end-to-end checks pass or have documented follow-up gaps.
    description: Add or run validation that covers editing, document management, persistence, and recovery states.
    id: validation
    title: Validate the editor workflow
    validationIntent: Run focused tests plus lint/build checks appropriate for the app.
version: "1"
