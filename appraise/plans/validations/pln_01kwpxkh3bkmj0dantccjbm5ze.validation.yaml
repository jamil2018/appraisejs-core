validations:
  - appraiseArtifacts:
      locatorGroups:
        - id: weather-page
          moduleId: weather-module
          name: Weather page
          route: /
      locators:
        - id: use-location-button
          locatorGroupId: weather-page
          name: Use location button
          value: '[data-testid="use-location-button"]'
        - id: weather-card
          locatorGroupId: weather-page
          name: Weather card
          value: '[data-testid="weather-card"]'
        - id: status-panel
          locatorGroupId: weather-page
          name: Status panel
          value: '[data-testid="status-panel"]'
        - id: refresh-button
          locatorGroupId: weather-page
          name: Refresh button
          value: '[data-testid="refresh-weather-button"]'
      modules:
        - id: weather-module
          name: Weather app
      testCases:
        - description: Verifies the app can load, obtain mocked browser coordinates, fetch mocked weather data, and render the current-weather summary with refresh affordance.
          id: current-weather-happy-path
          steps:
            - gherkinStep: Given I open the Weather Guy app
              id: open-app
              label: Open the app
              order: 0
              parameters:
                - name: url
                  type: TEXT
                  value: /
              templateStepName: Navigate to URL
            - gherkinStep: And browser geolocation resolves to latitude 40.7128 and longitude -74.0060
              id: mock-location
              label: Mock current location
              order: 1
              parameters:
                - name: latitude
                  type: NUMBER
                  value: "40.7128"
                - name: longitude
                  type: NUMBER
                  value: "-74.0060"
            - gherkinStep: And the weather service returns current conditions for the mocked coordinates
              id: mock-weather
              label: Mock weather response
              order: 2
              parameters:
                - name: temperature
                  type: NUMBER
                  value: "72"
                - name: condition
                  type: TEXT
                  value: Clear
            - gherkinStep: When I request weather for my current location
              id: request-weather
              label: Request local weather
              order: 3
              parameters:
                - locatorId: use-location-button
                  locatorName: Use location button
                  name: button
                  type: TEXT
                  value: Use my location
            - gherkinStep: Then I see the current weather summary and supporting metrics
              id: see-weather
              label: See current weather
              order: 4
              parameters:
                - locatorId: weather-card
                  locatorName: Weather card
                  name: summary
                  type: TEXT
                  value: Current weather
          title: Show current weather for browser location
        - description: Verifies denied geolocation permission shows an actionable status without weather API calls or stuck loading state.
          id: location-permission-denied
          steps:
            - gherkinStep: Given I open the Weather Guy app
              id: open-app-denied
              label: Open the app
              order: 0
              parameters:
                - name: url
                  type: TEXT
                  value: /
              templateStepName: Navigate to URL
            - gherkinStep: And browser geolocation rejects with permission denied
              id: deny-location
              label: Deny location
              order: 1
              parameters:
                - name: error
                  type: TEXT
                  value: PERMISSION_DENIED
            - gherkinStep: When I request weather for my current location
              id: request-location-denied
              label: Request location
              order: 2
              parameters:
                - locatorId: use-location-button
                  locatorName: Use location button
                  name: button
                  type: TEXT
                  value: Use my location
            - gherkinStep: Then I see a permission denied message and a retry control
              id: see-denied-state
              label: See permission guidance
              order: 3
              parameters:
                - locatorId: status-panel
                  locatorName: Status panel
                  name: status
                  type: TEXT
                  value: Location permission is needed
          title: Handle denied location permission
        - description: Verifies weather API/network errors are rendered clearly after location succeeds and can be retried.
          id: weather-api-failure
          steps:
            - gherkinStep: Given I open the Weather Guy app
              id: open-app-failure
              label: Open the app
              order: 0
              parameters:
                - name: url
                  type: TEXT
                  value: /
              templateStepName: Navigate to URL
            - gherkinStep: And browser geolocation resolves to latitude 40.7128 and longitude -74.0060
              id: mock-location-failure
              label: Mock current location
              order: 1
              parameters:
                - name: latitude
                  type: NUMBER
                  value: "40.7128"
                - name: longitude
                  type: NUMBER
                  value: "-74.0060"
            - gherkinStep: And the weather service returns an error for the mocked coordinates
              id: mock-weather-failure
              label: Mock failed weather response
              order: 2
              parameters:
                - name: status
                  type: NUMBER
                  value: "500"
            - gherkinStep: When I request weather for my current location
              id: request-weather-failure
              label: Request local weather
              order: 3
              parameters:
                - locatorId: use-location-button
                  locatorName: Use location button
                  name: button
                  type: TEXT
                  value: Use my location
            - gherkinStep: Then I see a weather unavailable message and a refresh control
              id: see-weather-error
              label: See weather error
              order: 4
              parameters:
                - locatorId: status-panel
                  locatorName: Status panel
                  name: status
                  type: TEXT
                  value: Weather is unavailable
          title: Handle weather API failure
      testSuites:
        - description: Reviewable AppraiseJS validation suite for location-based current weather behavior.
          id: weather-suite
          moduleId: weather-module
          name: Current weather workflow
          testCaseIds:
            - current-weather-happy-path
            - location-permission-denied
            - weather-api-failure
    executable:
      path: automation/features/current-weather-workflow.feature
      selector: Current weather workflow
    expectedFailures: []
