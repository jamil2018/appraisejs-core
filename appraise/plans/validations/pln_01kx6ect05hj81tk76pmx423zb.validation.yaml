customStepJustifications:
  - missingCapability: Deterministic browser-clock control across a multi-phase timer plus reload-localStorage assertions
    path: automation/steps/meditation-breathing-happy-path.steps.ts
    whyLocatorsAndExistingStepsAreInsufficient: The registry exposes atomic click, fill, and text assertions but no reusable navigation, clock advancement, reload, localStorage corruption/recovery, or multi-phase timer state capability. Atomic waits would make baseline and implementation validation slow and flaky.
  - missingCapability: Accessibility semantics, live-region cadence, focus visibility, and reduced-motion media emulation
    path: automation/steps/meditation-breathing-happy-path.steps.ts
    whyLocatorsAndExistingStepsAreInsufficient: The available generic steps cannot inspect ARIA live-region behavior over timer transitions, emulate prefers-reduced-motion, or assert focus-visible styling. These require Playwright-level browser assertions.
