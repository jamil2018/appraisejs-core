customStepJustifications:
  - missingCapability: Reusable multi-record creation and deterministic order assertion
    path: automation/steps/notes-happy-path.steps.ts
    whyLocatorsAndExistingStepsAreInsufficient: The registry has primitive click/fill/assert steps but no reusable operation for creating a second record and comparing card order.
  - missingCapability: DOM order assertion
    path: automation/steps/notes-happy-path.steps.ts
    whyLocatorsAndExistingStepsAreInsufficient: Existing visibility and text assertions cannot compare relative DOM order.
  - missingCapability: Concise deterministic edit workflow
    path: automation/steps/notes-happy-path.steps.ts
    whyLocatorsAndExistingStepsAreInsufficient: Primitive steps cannot express the combined edit and timestamp ordering operation without many duplicated steps.
  - missingCapability: DOM order assertion
    path: automation/steps/notes-happy-path.steps.ts
    whyLocatorsAndExistingStepsAreInsufficient: Existing assertions cannot compare relative DOM order.
  - missingCapability: Confirmed destructive workflow
    path: automation/steps/notes-happy-path.steps.ts
    whyLocatorsAndExistingStepsAreInsufficient: The workflow requires opening and confirming an in-app destructive dialog atomically for stable validation.
  - missingCapability: Combined absence and remaining-record assertion
    path: automation/steps/notes-happy-path.steps.ts
    whyLocatorsAndExistingStepsAreInsufficient: Existing registry visibility can assert one locator at a time but the stable outcome needs both deleted and retained record checks.
