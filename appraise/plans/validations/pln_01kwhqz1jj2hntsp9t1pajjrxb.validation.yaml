    patch: |
      diff --git a/automation/features/todo-workflow.feature b/automation/features/todo-workflow.feature
      new file mode 100644
      index 0000000..5753932
      --- /dev/null
      +++ b/automation/features/todo-workflow.feature
      @@ -0,0 +1,30 @@
      +Feature: Simply Todo 5 workflow
      +  The todo app should support the approved inline workflow with local persistence.
      +
      +  Scenario: Manage todos through the approved workflow
      +    Given the todo app starts with no saved todos
      +    Then I should see the empty state "No todos yet"
      +    When I add "Write validation prep" using the inline add form
      +    Then I should see "Write validation prep" in the todo list
      +    When I mark "Write validation prep" complete
      +    Then "Write validation prep" should appear completed
      +    When I filter by completed todos
      +    Then I should see "Write validation prep"
      +    When I edit "Write validation prep" to "Review validation prep"
      +    Then I should see "Review validation prep" in the todo list
      +    When I reload the app
      +    Then I should still see "Review validation prep"
      +    When I request deletion for "Review validation prep"
      +    Then I should see a deletion confirmation dialog
      +    When I cancel deletion
      +    Then I should still see "Review validation prep"
      +    When I confirm deletion for "Review validation prep"
      +    Then the todo list should return to the empty state
      +
      +  Scenario: Guard invalid and corrupted persistence states
      +    Given the todo app starts with no saved todos
      +    When I submit a blank inline todo
      +    Then no todo should be created
      +    When saved todo storage is malformed
      +    And I reload the app
      +    Then the app should recover to an empty todo list
    path: automation/features/todo-workflow.feature
    rationale: Gherkin validation artifact covering the approved todo workflow, empty state, inline add/edit, delete confirmation, filtering, persistence, and malformed storage recovery.
    status: added
  - beforeHash: null
    classification: test_infrastructure
    contentHash: sha256:c23088e9c22f0f6019f83b0c1d10b7c8f727dcc342c810f8d1528e97fbd3e1b0
    declared: true
    patch: |
      diff --git a/automation/steps/todo-workflow.steps.ts b/automation/steps/todo-workflow.steps.ts
      new file mode 100644
      index 0000000..8691156
      --- /dev/null
      +++ b/automation/steps/todo-workflow.steps.ts
      @@ -0,0 +1,50 @@
      +import { expect, test } from '@playwright/test'
      +
      +const storageKey = 'simply-todo-5:todos'
      +
      +test.describe('Simply Todo 5 workflow', () => {
      +  test.beforeEach(async ({ page }) => {
      +    await page.goto('/')
      +    await page.evaluate(key => window.localStorage.removeItem(key), storageKey)
      +    await page.reload()
      +  })
      +
      +  test('manages todos through inline CRUD, filtering, confirmation, and persistence', async ({ page }) => {
      +    await expect(page.getByText('No todos yet')).toBeVisible()
      +
      +    await page.getByLabel('New todo').fill('Write validation prep')
      +    await page.getByRole('button', { name: 'Add todo' }).click()
      +    await expect(page.getByText('Write validation prep')).toBeVisible()
      +
      +    await page.getByRole('checkbox', { name: 'Mark Write validation prep complete' }).check()
      +    await page.getByRole('button', { name: 'Completed' }).click()
      +    await expect(page.getByText('Write validation prep')).toBeVisible()
      +
      +    await page.getByRole('button', { name: 'Edit Write validation prep' }).click()
      +    await page.getByLabel('Edit todo text').fill('Review validation prep')
      +    await page.getByRole('button', { name: 'Save todo' }).click()
      +    await expect(page.getByText('Review validation prep')).toBeVisible()
      +
      +    await page.reload()
      +    await expect(page.getByText('Review validation prep')).toBeVisible()
      +
      +    await page.getByRole('button', { name: 'Delete Review validation prep' }).click()
      +    await expect(page.getByRole('alertdialog')).toBeVisible()
      +    await page.getByRole('button', { name: 'Cancel' }).click()
      +    await expect(page.getByText('Review validation prep')).toBeVisible()
      +
      +    await page.getByRole('button', { name: 'Delete Review validation prep' }).click()
      +    await page.getByRole('button', { name: 'Delete todo' }).click()
      +    await expect(page.getByText('No todos yet')).toBeVisible()
      +  })
      +
      +  test('rejects blank todos and recovers from malformed saved storage', async ({ page }) => {
      +    await page.getByLabel('New todo').fill('   ')
      +    await page.getByRole('button', { name: 'Add todo' }).click()
      +    await expect(page.getByText('No todos yet')).toBeVisible()
      +
      +    await page.evaluate(key => window.localStorage.setItem(key, 'not-json'), storageKey)
      +    await page.reload()
      +    await expect(page.getByText('No todos yet')).toBeVisible()
      +  })
      +})
    path: automation/steps/todo-workflow.steps.ts
    rationale: Playwright-style custom step skeleton for the approved Simply Todo 5 browser workflow using stable accessible labels and the localStorage key; includes the required registry/template-step reuse gap justification.
