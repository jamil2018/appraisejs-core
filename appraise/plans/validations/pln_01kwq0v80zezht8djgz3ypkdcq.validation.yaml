customStepJustifications:
  - missingCapability: Browser geolocation permission mocking and Open-Meteo response mocking for current-location weather flows.
    path: automation/steps/weather-current-location.steps.ts
    whyLocatorsAndExistingStepsAreInsufficient: The approved plan depends on deterministic geolocation and weather API outcomes. Existing navigation and locator interactions can open the app, but custom hooks are needed to set browser coordinates, simulate permission denial, intercept Open-Meteo responses, and assert weather-specific states without relying on live location or network.
