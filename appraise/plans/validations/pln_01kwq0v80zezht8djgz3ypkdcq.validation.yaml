validations:
  - appraiseArtifacts:
      locatorGroups:
        - id: weather-main-page
          moduleId: weather-app
          name: Weather main page
          route: /
      locators:
        - id: use-current-location
          locatorGroupId: weather-main-page
          name: Use current location button
          value: '[data-testid="use-current-location"]'
        - id: weather-summary
          locatorGroupId: weather-main-page
          name: Current weather summary
          value: '[data-testid="weather-summary"]'
        - id: location-error
          locatorGroupId: weather-main-page
          name: Location error message
          value: '[data-testid="location-error"]'
        - id: weather-error
          locatorGroupId: weather-main-page
          name: Weather error message
          value: '[data-testid="weather-error"]'
        - id: refresh-weather
          locatorGroupId: weather-main-page
          name: Refresh weather button
          value: '[data-testid="refresh-weather"]'
        - id: unit-toggle
          locatorGroupId: weather-main-page
          name: Temperature unit toggle
          value: '[data-testid="unit-toggle"]'
      modules:
        - id: weather-app
          name: Weather app
      testCases:
        - description: "Verifies the primary happy path: request location permission, resolve coordinates, fetch Open-Meteo weather, and render current conditions with refresh and unit controls."
          id: weather-current-location-success
          steps:
            - gherkinStep: Given I open the Weather Guy app
              id: open-weather-app
              label: Open the weather app
              order: 0
              parameters:
                - name: url
                  type: TEXT
                  value: /
              templateStepName: Navigate to URL
            - gherkinStep: When I grant browser location for latitude 23.8103 and longitude 90.4125
              id: grant-location
              label: Grant current location permission
              order: 1
              parameters:
                - name: latitude
                  type: TEXT
                  value: "23.8103"
                - name: longitude
                  type: TEXT
                  value: "90.4125"
            - gherkinStep: And the weather API returns current conditions for those coordinates
              id: mock-weather-success
              label: Provide deterministic weather response
              order: 2
              parameters:
                - name: temperature
                  type: TEXT
                  value: "31"
                - name: condition
                  type: TEXT
                  value: Partly cloudy
            - gherkinStep: When I request weather for my current location
              id: request-current-location
              label: Use current location
              order: 3
              parameters: []
            - gherkinStep: Then I see the current weather summary for my location
              id: assert-current-weather
              label: See current weather result
              order: 4
              parameters: []
            - gherkinStep: And I can refresh the weather and switch temperature units
              id: assert-controls
              label: See refresh and unit controls
              order: 5
              parameters: []
          title: Show current weather for the user's browser location
        - description: Verifies the app does not break when geolocation permission is denied or unavailable and offers a retry path.
          id: weather-location-denied
          steps:
            - gherkinStep: Given I open the Weather Guy app
              id: open-weather-app-denied
              label: Open the weather app
              order: 0
              parameters:
                - name: url
                  type: TEXT
                  value: /
              templateStepName: Navigate to URL
            - gherkinStep: When browser location permission is denied
              id: deny-location
              label: Deny current location permission
              order: 1
              parameters: []
            - gherkinStep: Then I see a recoverable location permission message
              id: assert-denied-state
              label: See permission guidance
              order: 2
              parameters: []
            - gherkinStep: And I can retry the current location request without reloading
              id: assert-retry
              label: Retry is available
              order: 3
              parameters: []
          title: Handle denied or unavailable location gracefully
        - description: Verifies network/API failures show a recoverable user-facing state instead of raw transport details.
          id: weather-api-failure
          steps:
            - gherkinStep: Given I open the Weather Guy app
              id: open-weather-app-api-failure
              label: Open the weather app
              order: 0
              parameters:
                - name: url
                  type: TEXT
                  value: /
              templateStepName: Navigate to URL
            - gherkinStep: When I grant browser location for latitude 23.8103 and longitude 90.4125
              id: grant-location-api-failure
              label: Grant current location permission
              order: 1
              parameters:
                - name: latitude
                  type: TEXT
                  value: "23.8103"
                - name: longitude
                  type: TEXT
                  value: "90.4125"
            - gherkinStep: And the weather API returns an error
              id: mock-weather-error
              label: Weather API fails
              order: 2
              parameters: []
            - gherkinStep: When I request weather for my current location
              id: request-weather-api-failure
              label: Use current location
              order: 3
              parameters: []
            - gherkinStep: Then I see a recoverable weather loading error
              id: assert-api-error
              label: See recoverable weather error
              order: 4
              parameters: []
          title: Handle weather API failure gracefully
      testSuites:
        - description: Validates the approved Weather Guy plan through AppraiseJS-authored current-location weather scenarios.
          id: weather-current-location-suite
          moduleId: weather-app
          name: Current location weather workflow
          testCaseIds:
            - weather-current-location-success
            - weather-location-denied
            - weather-api-failure
    executable:
      path: automation/features/weather-current-location.feature
      selector: Current location weather workflow
    expectedFailures: []
    gherkinPaths:
      - automation/features/weather-current-location.feature
    id: weather-current-location-workflow
    matrix:
      - browser: chromium
        environment: local
    required: true
    stepPaths:
      - automation/steps/weather-current-location.steps.ts
    taskIds:
      - scaffold-setup
      - location-permission-flow
      - weather-api-integration
      - result-rendering
      - validation
    testCaseIds:
      - weather-current-location-success
      - weather-location-denied
      - weather-api-failure
