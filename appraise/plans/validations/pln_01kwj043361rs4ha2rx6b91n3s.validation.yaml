customStepJustifications:
  - missingCapability: The generic registry/template steps do not yet encode the app-specific todo row semantics, inline edit/save/cancel behavior, and localStorage failure simulation required by this plan.
    path: automation/steps/todo-workflow.steps.ts
    whyLocatorsAndExistingStepsAreInsufficient: The reviewed plan needs domain-specific assertions that a failed localStorage write keeps in-memory todos visible and surfaces a shadcn Alert. Existing navigation, form, and assertion templates are reused where possible but need a thin todo-specific wrapper for stable review and later execution.
