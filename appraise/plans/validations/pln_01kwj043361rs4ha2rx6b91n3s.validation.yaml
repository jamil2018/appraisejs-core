validationDecisions: []
validations:
  - appraiseArtifacts:
      locatorGroups:
        - id: todo-page
          moduleId: todo-module
          name: Todo page
          route: /
      locators:
        - id: todo-input
          locatorGroupId: todo-page
          name: Todo input
          value: '[data-testid="todo-input"]'
        - id: todo-submit
          locatorGroupId: todo-page
          name: Todo submit button
          value: '[data-testid="todo-submit"]'
        - id: todo-edit
          locatorGroupId: todo-page
          name: Todo edit button
          value: '[data-testid="todo-edit"]'
        - id: todo-toggle
          locatorGroupId: todo-page
          name: Todo completion checkbox
          value: '[data-testid="todo-toggle"]'
        - id: filter-completed
          locatorGroupId: todo-page
          name: Completed filter
          value: '[data-testid="filter-completed"]'
        - id: todo-delete
          locatorGroupId: todo-page
          name: Todo delete button
          value: '[data-testid="todo-delete"]'
        - id: todo-empty-state
          locatorGroupId: todo-page
          name: Todo empty state
          value: '[data-testid="todo-empty-state"]'
        - id: storage-warning
          locatorGroupId: todo-page
          name: Storage warning alert
          value: '[data-testid="storage-warning"]'
      modules:
        - id: todo-module
          name: Simple Todo 6
      testCases:
        - description: Verifies the main inline-form todo workflow and persistence after reload.
          id: todo-primary-workflow
          steps:
            - gherkinStep: Given I open the Simple Todo 6 app
              id: open-app
              label: Open the app
              order: 0
              parameters:
                - name: url
                  type: TEXT
                  value: /
              templateStepName: Navigate to URL
            - gherkinStep: When I add a todo named "Review the Appraise plan"
              id: add-todo
              label: Add a todo through the inline form
              order: 1
              parameters:
                - name: text
                  type: TEXT
                  value: Review the Appraise plan
                - locatorId: todo-input
                  locatorName: Todo input
                  name: input
                  type: LOCATOR
                  value: '[data-testid="todo-input"]'
                - locatorId: todo-submit
                  locatorName: Todo submit button
                  name: submit
                  type: LOCATOR
                  value: '[data-testid="todo-submit"]'
              templateStepName: Fill text and submit form
            - gherkinStep: And I rename the todo to "Review the approved Appraise plan"
              id: rename-todo
              label: Rename the todo inline
              order: 2
              parameters:
                - name: text
                  type: TEXT
                  value: Review the approved Appraise plan
                - locatorId: todo-edit
                  locatorName: Todo edit button
                  name: edit
                  type: LOCATOR
                  value: '[data-testid="todo-edit"]'
              templateStepName: Edit row text
            - gherkinStep: And I mark the todo as completed
              id: complete-todo
              label: Complete the todo
              order: 3
              parameters:
                - locatorId: todo-toggle
                  locatorName: Todo completion checkbox
                  name: checkbox
                  type: LOCATOR
                  value: '[data-testid="todo-toggle"]'
              templateStepName: Toggle checkbox
            - gherkinStep: Then the completed filter shows "Review the approved Appraise plan"
              id: filter-completed
              label: Check the completed filter
              order: 4
              parameters:
                - locatorId: filter-completed
                  locatorName: Completed filter
                  name: filter
                  type: LOCATOR
                  value: '[data-testid="filter-completed"]'
                - name: text
                  type: TEXT
                  value: Review the approved Appraise plan
              templateStepName: Assert filtered text
            - gherkinStep: When I reload the app
              id: reload-app
              label: Reload the app
              order: 5
              parameters: []
              templateStepName: Reload page
            - gherkinStep: Then the todo "Review the approved Appraise plan" is still completed
              id: assert-restored
              label: Assert restored completed todo
              order: 6
              parameters:
                - name: text
                  type: TEXT
                  value: Review the approved Appraise plan
                - locatorId: todo-toggle
                  locatorName: Todo completion checkbox
                  name: checkbox
                  type: LOCATOR
                  value: '[data-testid="todo-toggle"]'
              templateStepName: Assert text and checked state
            - gherkinStep: When I delete the todo "Review the approved Appraise plan"
              id: delete-todo
              label: Delete the todo
              order: 7
              parameters:
                - locatorId: todo-delete
                  locatorName: Todo delete button
                  name: delete
                  type: LOCATOR
                  value: '[data-testid="todo-delete"]'
              templateStepName: Click element
            - gherkinStep: Then the todo list is empty
              id: assert-empty
              label: Assert empty state
              order: 8
              parameters:
                - locatorId: todo-empty-state
                  locatorName: Todo empty state
                  name: empty
                  type: LOCATOR
                  value: '[data-testid="todo-empty-state"]'
              templateStepName: Assert text visible
          title: Create, edit, complete, filter, delete, and restore todos
        - description: Verifies failed persistence keeps in-memory todos visible and shows a non-blocking warning.
          id: todo-storage-failure
          steps:
            - gherkinStep: Given I open the Simple Todo 6 app
              id: open-app-failure
              label: Open the app
              order: 0
              parameters:
                - name: url
                  type: TEXT
                  value: /
              templateStepName: Navigate to URL
            - gherkinStep: And local storage writes fail
              id: force-storage-failure
              label: Force local storage writes to fail
              order: 1
              parameters:
                - name: api
                  type: TEXT
                  value: localStorage.setItem
              templateStepName: Patch browser API
            - gherkinStep: When I add a todo named "Unsaved task"
              id: add-unsaved-todo
              label: Add an unsaved todo
              order: 2
              parameters:
                - name: text
                  type: TEXT
                  value: Unsaved task
              templateStepName: Fill text and submit form
            - gherkinStep: Then the todo "Unsaved task" remains visible
              id: assert-unsaved-visible
              label: Assert unsaved todo remains visible
              order: 3
              parameters:
                - name: text
                  type: TEXT
                  value: Unsaved task
              templateStepName: Assert text visible
            - gherkinStep: And I see a warning that changes are not saved locally
              id: assert-storage-warning
              label: Assert storage warning
              order: 4
              parameters:
                - locatorId: storage-warning
                  locatorName: Storage warning alert
                  name: alert
                  type: LOCATOR
                  value: '[data-testid="storage-warning"]'
              templateStepName: Assert text visible
          title: Show a warning when localStorage cannot save
      testSuites:
        - description: End-to-end reviewable workflow for the approved todo plan.
          id: todo-suite
          moduleId: todo-module
          name: Simple Todo 6 workflow
          testCaseIds:
            - todo-primary-workflow
            - todo-storage-failure
    executable:
      path: automation/features/todo-workflow.feature
      selector: Simple Todo 6 primary workflow
    expectedFailures: []
    gherkinPaths:
      - automation/features/todo-workflow.feature
    id: todo-primary-workflow
    matrix:
      - browser: chromium
        environment: local
    required: true
    stepPaths:
      - automation/steps/todo-workflow.steps.ts
    taskIds:
      - scaffold-setup
      - task-model-ui
      - crud-completion
      - persistence
      - validation
    testCaseIds:
      - todo-primary-workflow
      - todo-storage-failure
version: "1"
