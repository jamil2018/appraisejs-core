lifecycle: awaiting_plan_review
planId: test-new-plan-maker-flow-v2
revision: 1
tasks:
  - acceptanceCriteria:
      - Every appraise-0.5 session spec from 01 through 10 is represented in the scenario inventory.
      - Each scenario names the relevant lifecycle gate, adapter surface, expected artifact or event, and failure mode.
      - Deferred 0.5 exclusions such as direct contributor connections and automatic Git operations are explicitly out of scope.
    description: Create a traceability map from the appraise-0.5 master workflow and session specs to concrete test scenarios, including contract, storage, review UI, coordinator events, validation preparation, baseline, implementation checkpoints, CLI/skills recovery, and integration release scenarios.
    id: inventory-spec-scenarios
    title: Map specs to testable scenarios
    validationIntent: Review the scenario matrix against all markdown files in codex/development plan/appraise-0.5 and confirm no acceptance criteria or required scenario is missing.
  - acceptanceCriteria:
      - Valid and invalid fixtures cover duplicate IDs, duplicate YAML keys, unsafe aliases, invalid timestamps, invalid lifecycle transitions, oversized files, suspicious node replacement, and runtime-owned evidence mutation attempts.
      - Root and package contract copies accept and reject identical fixtures with stable field-level errors.
      - Parse and serialize round trips are deterministic with LF endings and no Next.js, Prisma, or root alias dependency.
    description: Verify the V1 plan, review, validation, and layout contracts, deterministic parsing/serialization, lifecycle transition table, stable node identity, append-only history, approval hashing, expected failure signatures, evidence references, and generated package parity.
    id: test-contract-and-artifacts
    title: Test plan contract and artifact rules
    validationIntent: Run focused contract fixture parity tests and lifecycle table tests across root and package contract modules.
  - acceptanceCriteria:
      - Traversal, symlink escape, stale hash, lock recovery, Windows path, malformed artifact, mixed-validity sync, delete, conflict, and idempotent sync cases are covered.
      - Projection upserts stable children, preserves linked TestRun records with nullable plan links, and never writes canonical YAML or sidecars.
      - Dirty worktree and non-Git fallback states produce visible reduced-assurance warnings without blocking reads unless approval/progression would be unsafe.
    description: Verify safe resolution of appraise/plans, atomic writes, compare-and-write protection, per-plan locks, SQLite projection, Git/dirty-file metadata, non-Git snapshot fallback, sync-plans and sync-all behavior, and stale projection handling.
    id: test-storage-projection-sync
    title: Test storage, projection, and sync safety
    validationIntent: Run artifact repository, projection transaction, Prisma, sync-plans, pending count, and Settings integration tests.
  - acceptanceCriteria:
      - MCP project_diagnostic covers healthy, missing identity, unreachable app, auth failure, project mismatch, dirty worktree, and non-Git cases.
      - plan_create, API, online CLI, and UI/service paths produce identical artifacts, projections, lifecycle, events, links, revision, and content hash for the same valid input.
      - Invalid plans report exact field paths and actionable messages instead of collapsed generic input errors.
    description: Verify that plan creation and reading behave consistently across MCP tools, internal API, online CLI, offline CLI draft creation, and visible application routes, with structured diagnostics, canonical links, and identical domain errors.
    id: test-plan-creation-adapters
    title: Test plan creation across MCP, API, CLI, and UI
    validationIntent: Run coordinator-client, API route, CLI parity, MCP E2E, and browser-visible smoke tests for create and read paths.
  - acceptanceCriteria:
      - Graph and accessible list expose equivalent review controls and status, including keyboard, screen-reader, and non-color cues.
      - Graph processing timeout, retry, stale worker, and repeated graph failure fall back to list review without invalidating the plan.
      - Approval rejects stale revisions; non-blocking remarks do not prevent approval; removed-node remarks remain visible and blocking; layout changes do not alter plan revision or approval hashes.
    description: Verify /plans and /plans/[planId], artifact health, owner/lifecycle/event summaries, graph/list equivalence, stable node and plan-wide remarks, blocking and non-blocking resolution flows, exact-revision approval, revision diff, orphaned remark behavior, suspicious replacement confirmation, and personal/shared layouts.
    id: test-review-visualizer
    title: Test review graph, list, remarks, and approval
    validationIntent: Run focused service/action tests plus browser QA with screenshots or traces for graph, list, remarks, approval, revision diff, fallback, and layout behavior.
  - acceptanceCriteria:
      - Duplicate connection, reconnect, takeover, expiry, redelivery, ordering, idempotency, cancellation, and long-poll race cases are covered.
      - Wrong token, project mismatch, DNS-rebinding origin, oversized request, and stdout protocol pollution fail safely.
      - The coordinator receives durable plan_review_ready before any review URL is presented, and reading an event never acknowledges it.
    description: Verify stable coordinator identity, token protections, heartbeat lease, reconnect, user-approved takeover, durable monotonic outbox, at-least-once event delivery, idempotent acknowledgement, cancellation precedence, API limits, localhost protections, and MCP protocol hygiene.
    id: test-coordinator-events-mcp
    title: Test coordinator identity, events, and MCP orchestration
    validationIntent: Run event service, internal API, MCP stdio, security boundary, and reconnect tests, including transcript evidence for pending events before resume.
  - acceptanceCriteria:
      - Required validation nodes and every flagged production or requires_review file must be approved for current hashes before progression.
      - Product implementation is blocked during validation preparation unless the exact file is explicitly approved; undeclared changes block validation approval.
      - Changed-after-approval, ambiguous classification, dirty worktree, non-Git fallback, manifest mismatch, rejected validation, and corrected resubmission cases are covered.
    description: "Verify the second approval gate after plan approval: generated validation nodes, Appraise test cases, Gherkin, executable steps, matrix configuration, file classification, independent Git/snapshot delta computation, coordinator manifest reconciliation, per-file rationale, diff review, feedback threads, content-hash invalidation, and validation-node approval."
    id: test-validation-preparation
    title: Test validation preparation and file review gate
    validationIntent: Run validation service tests, file classification tests, diff/hash invalidation tests, and a browser-visible review showing a production file blocking progression until handled.
  - acceptanceCriteria:
      - All required matrix combinations require accepted baselines before implementation unlocks.
      - Expected behavioral failures, accepted regression passes, unrelated pre-existing failures, invalid setup/fixture/infrastructure failures, undefined steps, unexpected timeouts, unmatched failures, duplicate scheduling, cancellation, rerun, and reconciliation cases are covered.
      - Changed tests/files revoke affected validation approval and baseline; changed unrelated failure signatures revoke carried-forward acknowledgement.
    description: Verify approved validations run before implementation, expected failure signatures are browser/environment scoped, Appraise TestRun evidence is preserved for every required combination, baseline results are classified correctly, interrupted runs recover, and unrelated pre-existing failures require explicit acknowledgement.
    id: test-baseline-acceptance
    title: Test baseline execution and acceptance
    validationIntent: Run baseline service tests and plan-linked Appraise TestRun scenarios with evidence links to logs, reports, traces, and screenshots.
  - acceptanceCriteria:
      - Required tasks reach verified and required validations pass fresh runs before validation_passed is emitted.
      - Passing validation does not complete the plan; explicit final user approval is required.
      - Plan-wide and task-scoped blocking feedback pauses the correct tasks and dependents; user-confirmed impact analysis preserves only unaffected approvals.
    description: Verify task states, typed dependencies, implementation groups, checkpoint polling before and after tasks/groups, event checks before validation and completion, midstream feedback impact analysis, pause/resume/cancel, targeted reruns, fresh final required matrix, optional failures, non-blocking remarks, and explicit user completion.
    id: test-implementation-checkpoints
    title: Test implementation checkpoints and completion review
    validationIntent: Run checkpoint, task state, dependency, pause/resume/cancel, final evidence, and completion review tests, including event-race cases.
  - acceptanceCriteria:
      - Offline mode can create draft artifacts only and cannot mutate lifecycle state.
      - Skills perform diagnostic-first operation, read pending events at checkpoints, cite returned Appraise links/evidence, and do not claim approval from chat text.
      - MCP failures produce actionable recovery without silent CLI fallback; CLI cannot impersonate or silently take over an active coordinator.
    description: Verify doctor, plan validate-file, plan create/status/revise/events/ack/reconnect/register flows, offline versus online capability boundaries, takeover warnings, pending cancellation handling, stale revision recovery, MCP failure messaging, and skill policies that stop at review gates.
    id: test-recovery-cli-skills
    title: Test CLI, skill policy, and recovery flows
    validationIntent: Run CLI unit/integration tests, skill policy tests, and transcript-style E2E checks for new plan, change request, validation rejection, reconnect, and final completion.
  - acceptanceCriteria:
      - Required scenarios include MCP plan creation and review URL, graph list fallback, plan revision approval, production-file validation block, rejected validation resubmission, expected-failure baseline, unrelated-failure acknowledgement, implementation unlock, scoped pause, reconnect, final pass, optional failure, non-blocking follow-up, Git conflict, event partial failure, app restart, interrupted validation, and non-Git fallback.
      - Scaffold sync follows docs/scaffold-template-sync.md; local tokens, leases, personal layouts, event rows, locks, and reports are excluded from scaffolds.
      - Focused lint, Prettier, Vitest, Playwright/Cucumber, MCP E2E, quality gates, builds, and template diff review are run or explicitly explained.
    description: Verify adapter parity, concurrency, failure recovery, demo assets, documentation, scaffold sync, generated residue cleanup, and release-level validation gates across root and create-appraisejs template surfaces.
    id: test-release-integration-scaffolds
    title: Test release integration, scaffolds, and documentation
    validationIntent: Run release integration suites, scaffold sync commands when applicable, root/package builds, quality:fallow:commit, quality:react-doctor:commit, and browser-visible demo QA.
version: "1"
