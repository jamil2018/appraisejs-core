description: Prepare a comprehensive testing plan for the AppraiseJS 0.5 plan maker flow, grounded in codex/development plan/appraise-0.5 feature specs. The plan covers the full journey from MCP diagnostic and structured plan creation through review, revision, validation preparation, baseline acceptance, implementation checkpoints, recovery, adapter parity, scaffold behavior, accessibility, and release-level end-to-end evidence. This is a test planning artifact only; it does not implement product behavior.
