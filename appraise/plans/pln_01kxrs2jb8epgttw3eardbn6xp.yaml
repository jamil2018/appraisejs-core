description: Create a polished, accessible, responsive reminder application named ForgotSomething. Users can create, edit, delete, complete, and reopen reminders with a required title, optional notes, and a due date/time. The application durably persists data in the browser, clearly organizes active reminders into overdue and upcoming groups, keeps completed reminders distinct, and includes meaningful automated unit and browser validation for core behavior.
