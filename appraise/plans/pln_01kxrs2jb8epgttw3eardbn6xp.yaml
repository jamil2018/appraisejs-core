tasks:
  - acceptanceCriteria:
      - The target workspace contains a runnable TypeScript React application named ForgotSomething.
      - Development, build, lint, unit-test, and browser-test scripts are documented and execute deterministically.
      - The initial application shell loads without console errors and uses a responsive layout foundation.
    description: Initialize a TypeScript React application in the empty target workspace with a maintainable feature-oriented structure, deterministic scripts, styling foundations, and test tooling suitable for browser-based local-first operation.
    id: task-1
    title: Scaffold the application and shared foundations
    validationIntent: Install dependencies, run lint and production build, start the application, and verify the shell loads at desktop and narrow mobile viewports without console errors.
  - acceptanceCriteria:
      - Each reminder has a stable ID, required non-empty title, optional notes, due date/time, completion state, and created/updated timestamps.
      - Malformed persisted data is handled safely without crashing the application.
      - Creating, editing, deleting, completing, and reopening reminders updates durable local storage.
      - Reminder state survives a full browser reload.
    description: Define the reminder model and a storage boundary that validates persisted browser data, preserves stable reminder IDs, and supports create, update, delete, completion, and reopen operations across reloads.
    id: task-2
    title: Implement the reminder domain and durable local persistence
    validationIntent: Use focused unit tests for domain validation, storage hydration, malformed-data recovery, CRUD mutations, completion toggles, and reload persistence.
  - acceptanceCriteria:
      - A user can create a reminder with a required title, optional notes, and due date/time.
      - A user can edit every authored field without changing the reminder's stable identity.
      - A user can delete a reminder only after an explicit confirmation interaction.
      - A user can mark a reminder complete and reopen it.
      - Form labels, validation messages, focus movement, and interactive controls are keyboard and screen-reader accessible.
    description: Create accessible forms and reminder controls for adding, editing, deleting, completing, and reopening reminders, with clear validation, confirmation for deletion, keyboard operation, and helpful empty/error states.
    id: task-3
    title: Build accessible reminder creation and editing flows
    validationIntent: Use browser tests to create, edit, cancel deletion, confirm deletion, complete, and reopen reminders; assert required-field errors, semantic labels, keyboard focus behavior, and visible state changes.
  - acceptanceCriteria:
      - Incomplete reminders with due times before the current time appear in an Overdue section.
      - Incomplete reminders due now or later appear in an Upcoming section.
      - Completed reminders appear in a distinct Completed section regardless of due time.
      - Reminders within active sections are ordered by due time with deterministic tie-breaking.
      - Empty sections and overdue status are communicated with readable text, not color alone.
    description: Derive clear reminder sections from due date/time and completion state, with deterministic ordering and human-readable urgency cues that do not rely on color alone.
    id: task-4
    title: Organize overdue, upcoming, and completed reminders
    validationIntent: Use deterministic-clock unit and browser tests covering overdue/upcoming boundaries, completion precedence, ordering, empty sections, and non-color status text.
  - acceptanceCriteria:
      - The primary workflow is usable without horizontal scrolling at supported mobile and desktop widths.
      - Visible focus, contrast, headings, landmarks, status messaging, and dialog semantics support accessible use.
      - Automated tests cover persistence plus the end-to-end create, edit, organize, complete, reopen, and delete lifecycle.
      - The README documents setup, commands, local persistence scope, and known browser-data limitations.
      - Lint, unit tests, browser tests, and production build pass.
    description: Polish the experience across viewport sizes, document local usage and storage behavior, and complete meaningful automated validation of the full happy path and essential accessibility behavior.
    id: task-5
    title: Harden responsive UX and automated validation
    validationIntent: Run the complete validation suite, exercise the full reminder lifecycle at desktop and mobile viewport sizes, check keyboard focus and horizontal overflow, and verify the README commands from a clean install.
version: "1"
