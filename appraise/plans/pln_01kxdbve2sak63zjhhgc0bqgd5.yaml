description: Create a compact React, TypeScript, and Vite notes application with local persistence, full note CRUD, search, responsive accessible UI, automated tests, and Appraise-compatible browser validation.
edges:
  - from: task-2
    to: task-1
    type: depends-on
  - from: task-3
    to: task-2
    type: depends-on
  - from: task-4
    to: task-2
    type: depends-on
  - from: task-4
    to: task-3
    type: depends-on
goal: Build a simple accessible notes app
implementationGroups:
  - id: group-foundation
    taskIds:
      - task-1
  - id: group-product
    taskIds:
      - task-2
      - task-3
  - id: group-validation
    taskIds:
