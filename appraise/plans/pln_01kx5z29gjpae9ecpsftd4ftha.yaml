tasks:
  - acceptanceCriteria:
      - The app starts through a documented Vite dev command.
      - The production build completes successfully.
      - The project has only the dependencies needed for the small static experience.
    description: Create the minimal package, Vite, TypeScript, HTML, and source structure without a backend or unnecessary runtime dependencies.
    id: app-foundation
    title: Create the Vite TypeScript foundation
    validationIntent: Install dependencies, run focused unit tests, and run the production build.
  - acceptanceCriteria:
      - A non-empty motivational quote and author are visible on initial load.
      - Activating New quote replaces both quote and author with a different entry.
      - Quote rotation uses the local set and requires no network or backend.
    description: Add a local curated quote set and render the current quote and author on first paint. Advance through the set deterministically with a New quote button so browser tests are stable.
    id: quote-experience
    title: Implement deterministic quote display and rotation
    validationIntent: Unit-test quote rotation and validate initial/next quote behavior in the browser.
  - acceptanceCriteria:
      - Activating Copy quote writes the displayed quote and author to the clipboard.
      - Successful copy produces visible feedback.
      - The status feedback is announced without stealing focus and failure is handled clearly.
    description: Copy the current quote and author to the clipboard and expose success or failure feedback in a screen-reader-announced status region.
    id: copy-interaction
    title: Add copy interaction with accessible feedback
    validationIntent: Exercise the copy action in a browser context with clipboard permission and assert the visible live-region feedback.
  - acceptanceCriteria:
      - All controls are reachable and operable by keyboard.
      - Semantic headings, quote markup, button names, and a live status region support assistive technology.
      - The quote card and controls remain readable and usable at narrow and wide viewports.
    description: Style a focused single-card experience with semantic content, clear focus states, sufficient contrast, and mobile-to-desktop responsiveness.
    id: responsive-accessible-ui
    title: Create a responsive accessible interface
    validationIntent: Run browser assertions for accessible roles/names, keyboard activation, focus visibility, and narrow viewport layout.
  - acceptanceCriteria:
      - Appraise-managed browser validation covers initial quote, next quote, copy feedback, keyboard operation, and a narrow viewport.
      - Browser checks are deterministic and do not depend on a network quote API.
      - Unit tests and production build pass after implementation.
    description: Create Appraise-native executable validation artifacts for the initial quote, deterministic next quote, copy feedback, accessibility, and responsive layout; also retain unit and production-build checks.
    id: browser-validation
    title: Create and run deterministic automated validation
    validationIntent: Run the approved Appraise-managed Cucumber/Playwright validation against the target and reconcile its TestRun evidence before completion.
version: "1"
