description: Create a dependency-light Vite and vanilla TypeScript web app backed by a local curated quote set. It must render a quote and author immediately, rotate deterministically to a different quote, copy the displayed quote with accessible status feedback, remain responsive, and pass unit, build, and Appraise-managed browser validation.
