description: Create a dependency-light browser grocery list application in /private/tmp/HomeChores. Users can add grocery items, see the current list, toggle each item between purchased and unpurchased, delete items, and retain the exact list state across page reloads. Include a usable responsive interface, accessible controls, deterministic local startup, and Appraise-managed browser validation.
