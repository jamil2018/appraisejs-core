tasks:
  - acceptanceCriteria:
      - The app runs locally with React 19, TypeScript, and Vite.
      - The project includes focused unit/component tests and a production build command.
      - The initial layout works at narrow and wide viewport widths.
    description: Create the React 19, TypeScript, and Vite app shell with focused test tooling and responsive base styling.
    id: scaffold-app
    title: Scaffold the browser application
    validationIntent: Install dependencies, run the focused test suite, and build the production bundle.
  - acceptanceCriteria:
      - Starting begins at inhale and advances through hold and exhale using the configured durations.
      - Pause freezes remaining time and resume continues without losing phase or cycle state.
      - Reset returns to the configured idle state, and the final exhale transitions to a completed state.
    description: Implement a deterministic timed state machine for inhale, hold, and exhale phases, cycle progress, pause/resume, reset, and completion.
    id: breathing-engine
    title: Implement the breathing exercise engine
    validationIntent: Use fake-timer unit tests to verify phase transitions, pause/resume, reset, repeated cycles, and completion.
  - acceptanceCriteria:
      - The current phase, seconds remaining, and cycle progress are visible throughout an exercise.
      - Start, pause/resume, and reset controls expose only valid actions for the current state.
      - Settings reject invalid ranges and are disabled while an exercise is running or paused.
    description: Present a calm visual timer, numeric countdown, active phase, cycle progress, controls, and validated settings for inhale, hold, exhale, and cycle count.
    id: exercise-ui
    title: Build the exercise and settings UI
    validationIntent: Use component tests to exercise settings validation and the complete control happy path.
  - acceptanceCriteria:
      - Valid preferences survive reload and corrupt stored data falls back safely to defaults.
      - All interactive controls have accessible names, are keyboard operable, and display a visible focus indicator.
      - An aria-live status region announces phase changes, pause/resume, reset, and completion without announcing every countdown tick.
      - The visual timer honors prefers-reduced-motion.
    description: Persist only preferences in localStorage and provide semantic keyboard-operable controls, visible focus, reduced-motion support, and concise aria-live announcements.
    id: persistence-accessibility
    title: Add local persistence and accessibility
    validationIntent: Run component/browser tests for preference restoration, invalid stored values, keyboard use, status announcements, and reduced-motion styling.
  - acceptanceCriteria:
      - A user can configure short durations, start, pause/resume, reset, restart, and complete the requested cycles.
      - Reload restores preferences but not an in-progress session.
      - Focused tests, end-to-end validation, lint/type checks, and production build pass.
    description: Add and run end-to-end browser coverage for configuring an exercise, completing cycles, persistence, controls, and accessibility semantics.
    id: validate-experience
    title: Validate the complete happy path
    validationIntent: Run Appraise-managed browser validation plus the app test, lint/type-check, and build commands, recording exact evidence.
version: "1"
