tasks:
  - acceptanceCriteria:
      - The application starts locally using documented package scripts.
      - The main layout is usable at mobile and desktop widths without horizontal overflow.
      - Controls use semantic HTML and visible focus states.
    description: Create a maintainable web app foundation in the empty target workspace with responsive styling and testable semantics.
    id: scaffold
    title: Scaffold the todo web app
    validationIntent: Verify the app loads at desktop and mobile viewport sizes and exposes a usable primary todo form.
  - acceptanceCriteria:
      - Submitting non-empty text creates one todo.
      - Users can edit an existing todo and save the changed text.
      - Empty or whitespace-only todos are rejected without creating a record.
    description: Add the todo data model and user flows to create and edit todo text.
    id: todo-crud
    title: Implement todo creation and editing
    validationIntent: Create a todo, edit it through keyboard-accessible controls, and assert the updated text.
  - acceptanceCriteria:
      - Each todo can be marked completed and returned to active.
      - Each todo can be deleted without affecting other todos.
      - Completion and deletion controls have accessible names.
    description: Allow users to complete, uncomplete, and delete individual todos.
    id: completion-delete
    title: Implement completion and deletion
    validationIntent: Toggle completion both ways, delete a todo, and assert list state after each operation.
  - acceptanceCriteria:
      - Todos and completion state are restored after a browser reload.
      - All, Active, and Completed filters show the correct records.
      - The selected filter is conveyed visually and programmatically.
    description: Persist todo state across reloads and provide All, Active, and Completed views.
    id: persistence-filters
    title: Persist todos and add filters
    validationIntent: Create active and completed todos, exercise every filter, reload, and confirm records and completion state persist.
  - acceptanceCriteria:
      - All core controls are reachable and operable by keyboard.
      - Editing has a clear keyboard save and cancel path with sensible focus restoration.
      - The app remains usable at a narrow mobile viewport with no horizontal overflow.
      - Status and empty states are understandable without relying only on color.
    description: Refine layout, keyboard behavior, focus management, and accessible feedback for a robust end-user experience.
    id: quality
    title: Polish responsive and accessible interactions
    validationIntent: Exercise keyboard-only creation/editing, inspect focus and accessible names, and check narrow viewport overflow.
  - acceptanceCriteria:
      - Automated validation covers create, edit, complete, uncomplete, delete, filters, and reload persistence.
      - Automated validation covers keyboard interaction and responsive no-overflow behavior.
      - Validation is runnable through the documented command and produces deterministic results.
    description: Provide automated coverage for the reviewed core workflow and quality requirements.
    id: validation
    title: Author automated happy-path validation
    validationIntent: Run the full managed Appraise validation matrix and retain Appraise TestRun evidence.
version: "1"
