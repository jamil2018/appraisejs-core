version: '1'
planId: semantic-plan-flow-graph
revision: 1
lifecycle: awaiting_plan_review
goal: Make plan dependency flow easy to follow
description: Validate the semantic plan review graph and accessible list fallback used by AppraiseJS review surfaces.
tasks:
  - id: derive-deterministic-task-steps
    title: Derive deterministic task steps
    description: Convert plan tasks and relationships into deterministic step metadata for graph and list review.
    acceptanceCriteria:
      - Each task receives a stable step number.
      - Review state remains readable without relying on graph layout.
    validationIntent: Run the plan-review Playwright smoke.
  - id: render-numbered-workflow
    title: Render a numbered left-to-right workflow graph
    description: Render the task sequence as a keyboard-operable graph with matching accessible list content.
    acceptanceCriteria:
      - The graph and accessible list expose the same task relationships.
      - The selected task inspector remains reachable by keyboard.
    validationIntent: Verify graph and accessible list controls through Playwright.
edges:
  - from: render-numbered-workflow
    to: derive-deterministic-task-steps
    type: depends-on
implementationGroups:
  - id: review-surface
    taskIds:
      - derive-deterministic-task-steps
      - render-numbered-workflow
