tasks:
  - acceptanceCriteria:
      - The app uses React 19, TypeScript, and Vite, and can be installed, started locally, and built without missing dependency errors.
      - No third-party UI component library is required; styling is handled with plain CSS, CSS custom properties, and local React components.
      - Project structure separates UI components, location hooks, weather data hooks, weather API access, shared weather types, and tests.
      - The first screen is the usable weather experience, not a marketing landing page.
    description: "Create a React 19 + TypeScript + Vite application structure. Use plain CSS with CSS custom properties and small local components rather than a third-party UI library. Establish the planned files: `src/main.tsx`, `src/App.tsx`, `src/components/WeatherCard.tsx`, `src/components/StatusPanel.tsx`, `src/components/MetricGrid.tsx`, `src/hooks/useCurrentLocation.ts`, `src/hooks/useCurrentWeather.ts`, `src/services/weatherApi.ts`, `src/types/weather.ts`, `src/test/`, and `src/App.css`."
    id: scaffold-weather-app
    title: Scaffold the React weather app
    validationIntent: Run install/build checks and confirm the dev server renders the app shell with the declared stack and file layout.
  - acceptanceCriteria:
      - The app requests current location only through a clear user action or initial app flow appropriate for browser permissions.
      - Permission denied and unsupported geolocation states show actionable UI instead of failing silently.
      - Location state can be refreshed and does not leave stale loading indicators.
      - The hook exposes typed status/data/error values that UI components can render predictably.
    description: Use the browser Geolocation API in `src/hooks/useCurrentLocation.ts` to request the user's current coordinates and model loading, success, denied, unavailable, timeout, and unsupported-browser states.
    id: location-permission-flow
    title: Implement browser location handling
    validationIntent: Mock navigator.geolocation in tests to verify success, denied, timeout/error, and unsupported-browser paths.
  - acceptanceCriteria:
      - Weather requests use the coordinates from the location flow and surface API/network failures cleanly.
      - The weather model includes temperature, condition text or icon metadata, location label or coordinates, and available details such as feels-like, high/low, humidity, and wind.
      - API configuration is documented so the project can be run by another developer.
      - Live network access is isolated behind `weatherApi.ts` so tests can mock it cleanly.
    description: Choose and integrate a browser-accessible current-weather API through `src/services/weatherApi.ts`, map raw responses into typed weather models in `src/types/weather.ts`, and document any required environment variable or API key setup.
    id: weather-data-integration
    title: Fetch current weather for coordinates
    validationIntent: Mock weather API responses for success and failure, and run build/test checks without relying on live network weather data.
  - acceptanceCriteria:
      - The UI clearly shows the user's current weather once location and weather data resolve.
      - Loading, permission, unsupported-browser, and API-error states are visually distinct and understandable.
      - Refresh re-requests location/weather data and updates the displayed timestamp or freshness indicator.
      - The layout works on mobile and desktop without text overlap.
      - Controls use semantic buttons and accessible status messaging.
    description: Render a responsive current-weather interface using local components such as `WeatherCard`, `StatusPanel`, and `MetricGrid`, with readable weather summary, supporting metrics, loading and error states, and a refresh control.
    id: current-weather-ui
    title: Build the current-weather experience
    validationIntent: Use component or end-to-end tests for the happy path and key UI states, plus a manual responsive check if available.
  - acceptanceCriteria:
      - Tests cover mocked geolocation success, permission denial, unsupported geolocation, weather API success, and weather API failure.
      - README documents install, dev, build, test, project structure, UI library decision, and weather API configuration steps.
      - Build and test commands pass or any gaps are explicitly documented for review.
    description: Add focused automated checks and concise project documentation covering React 19 + Vite setup, plain-CSS UI approach, project structure, environment variables, local commands, and the location/weather behavior.
    id: validation-and-docs
    title: Validate and document the app
    validationIntent: Run the final test/build suite and record validation evidence for Appraise review.
version: "1"
