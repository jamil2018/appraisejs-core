description: "Build a simple current-weather web app in /Users/jamil/Personal Projects/weather-guy. Use React 19 + TypeScript + Vite for a lightweight single-page app. Use plain CSS with CSS custom properties and small hand-built React components, not a third-party UI component library, because the app is compact and needs only a focused weather card, status views, metric rows, and buttons. The app should request the user's current browser location with the Geolocation API, fetch current weather for those coordinates, and render a polished current-weather view with location context, temperature, conditions, useful details, refresh behavior, and graceful loading, permission, unsupported-browser, and API-error states. Select a client-appropriate weather provider and document required API key setup, preferring a no-key provider if practical. Validation should mock geolocation and weather responses for the happy path and error/permission states. Planned project structure: `src/main.tsx`, `src/App.tsx`, `src/components/WeatherCard.tsx`, `src/components/StatusPanel.tsx`, `src/components/MetricGrid.tsx`, `src/hooks/useCurrentLocation.ts`, `src/hooks/useCurrentWeather.ts`, `src/services/weatherApi.ts`, `src/types/weather.ts`, `src/test/`, `src/App.css`, and `README.md`."
