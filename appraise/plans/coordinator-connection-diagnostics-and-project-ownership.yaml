description: Make AppraiseJS coordinator bootstrap and diagnostics accurately distinguish local identity setup, transport, authentication, and project mismatch failures; support generic directories without package.json; and prevent accidental cross-project online plan registration unless explicitly authorized.
edges:
  - from: identity-bootstrap
    to: diagnostic-classification
    type: blocks
  - from: identity-bootstrap
    to: project-mismatch-contract
    type: relates-to
  - from: diagnostic-classification
    to: mcp-recovery
    type: blocks
  - from: project-mismatch-contract
    to: plan-ownership-guard
    type: relates-to
  - from: plan-ownership-guard
    to: sync-and-runtime-validation
    type: blocks
  - from: mcp-recovery
    to: sync-and-runtime-validation
    type: blocks
goal: Fix coordinator connection diagnostics and project ownership
implementationGroups:
  - id: identity-and-diagnostics
    taskIds:
      - identity-bootstrap
      - diagnostic-classification
  - id: ownership-and-auth
    taskIds:
      - project-mismatch-contract
      - plan-ownership-guard
  - id: integration-and-proof
    taskIds:
      - mcp-recovery
      - sync-and-runtime-validation
lifecycle: awaiting_plan_review
planId: coordinator-connection-diagnostics-and-project-ownership
revision: 1
tasks:
  - acceptanceCriteria:
      - A generic directory without package.json can initialize stable coordinator credentials.
      - CLI/MCP and application identity derivation use the same canonical algorithm and remain compatible for existing valid identities.
      - Diagnostics report local identity bootstrap errors as identity or project-setup failures rather than application reachability failures.
      - The identity check reflects credentials created during the same diagnostic invocation.
    description: Create a shared identity derivation path for CLI/MCP and the application that fingerprints the canonical project path with an optional package name, supports directories without package.json, reports malformed package metadata precisely, and makes diagnostic identity status reflect post-initialization state.
    id: identity-bootstrap
    title: Decouple and harden project identity bootstrap
    validationIntent: Add focused unit tests for missing package.json, malformed package.json, existing identities, stable fingerprints, and same-run diagnostic initialization.
  - acceptanceCriteria:
      - Fetch connection failures retain a concrete transport cause and configured endpoint.
      - HTTP/API failures remain distinct from DNS or socket failures.
      - Authentication failures distinguish project mismatch from an invalid token.
      - Diagnostic JSON exposes stable error codes, safe details, and recovery actions without leaking coordinator tokens.
      - Loopback fallback probing, if used, is diagnostic-only and reports each attempted endpoint.
    description: Restructure diagnostics into explicit local bootstrap, transport, HTTP, authentication, and project-identity checks while preserving safe underlying causes and actionable recovery details. Probe configured endpoints without guessing that hostname changes solve unrelated failures.
    id: diagnostic-classification
    title: Classify connectivity and coordinator failures precisely
    validationIntent: Use mocked fetch failures and API responses to cover connection refusal, non-JSON responses, HTTP errors, token mismatch, and project mismatch classifications.
  - acceptanceCriteria:
      - Unknown project fingerprints return a dedicated project-mismatch response rather than generic invalid credentials.
      - Wrong tokens for the server project remain unauthorized without exposing secrets.
      - Diagnostic and client error types preserve the mismatch code, fingerprints, and recovery guidance.
      - The server reports its canonical project path only in local diagnostic contexts where disclosure is explicitly allowed.
    description: Change coordinator request authentication and diagnostic responses so a server bound to another project returns a dedicated mismatch code with safe requested and server project fingerprints plus recovery guidance, while preserving generic unauthorized handling for a wrong token on the correct project.
    id: project-mismatch-contract
    title: Expose project identity mismatch safely
    validationIntent: Extend service, request-guard, API-boundary, coordinator-client, and MCP tests for mismatch and wrong-token branches.
  - acceptanceCriteria:
      - Online plan create rejects an external file by default before sending an API request.
      - The explicit override permits intentional cross-project submission and emits a machine-readable warning.
      - Create responses identify the coordinator project fingerprint and canonical project path and record or return the canonical source file path.
      - Files inside the project, including symlink-resolved paths, continue to work without an override.
      - MCP plan_create remains bound to its configured coordinator project and returns ownership metadata.
    description: Resolve coordinator cwd and plan file paths before online CLI creation, block files outside the coordinator project by default, add an explicit --allow-external-plan-file override, and return coordinator ownership and source-file metadata with a warning when the override is used.
    id: plan-ownership-guard
    title: Guard online plan creation against cross-project files
    validationIntent: Add CLI and client tests for inside-project files, traversal and symlink cases, default rejection, explicit override, and ownership metadata.
  - acceptanceCriteria:
      - A missing package.json no longer prevents MCP startup for a valid directory.
      - Bootstrap failures include a stable category, the doctor command, and clear reconnect guidance without silently falling back to CLI.
      - Coordinator docs describe project binding, mismatch recovery, endpoint diagnostics, and the external-file override.
    description: Make MCP bootstrap failures actionable when tools cannot be exposed by reporting the exact local setup or connection category on stderr and documenting the reconnect/restart workflow; ensure generic-directory identity support prevents missing package.json from suppressing the tool surface.
    id: mcp-recovery
    title: Improve MCP bootstrap and reconnection guidance
    validationIntent: Extend MCP startup/E2E coverage to assert tool discovery for a generic directory and structured bootstrap messaging for genuine failures.
  - acceptanceCriteria:
      - Root, starter, blank, and create-appraisejs templates contain synchronized coordinator behavior.
      - Focused lint, formatting, unit tests, package build, and full build appropriate to the broad runtime change pass.
      - A live generic workspace diagnostic reports accurate initialized identity and project mismatch guidance.
      - An external plan is blocked by default and succeeds only with the explicit override.
      - The resulting plan review page is reachable and displays the expected plan content and project ownership context.
    description: Propagate canonical root changes through both scaffold template sync workflows, then validate the fixed scenarios through focused tests, package build, live MCP diagnostics, plan creation, event review, and browser-visible ownership/review information.
    id: sync-and-runtime-validation
    title: Synchronize scaffolds and verify the live workflow
    validationIntent: Run focused Vitest suites, ESLint and Prettier checks, template sync commands, Appraise package build, root build, live MCP calls, and browser verification of the review surface.
version: '1'
