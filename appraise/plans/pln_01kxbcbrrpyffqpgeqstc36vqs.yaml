description: Build a small React + TypeScript notes app where users can create, edit, delete, and search notes. Persist notes locally in the browser, display notes ordered by most recently updated first, and provide an accessible responsive user interface. Include automated browser validation covering the complete create/edit/delete/search/persistence/order workflow. This is a fresh empty target workspace.
