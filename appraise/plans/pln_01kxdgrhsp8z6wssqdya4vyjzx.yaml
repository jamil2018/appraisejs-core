description: Create a lightweight React and TypeScript todo web app with add, completion toggle, deletion, All/Active/Completed filtering, localStorage persistence for todos and selected filter, responsive presentation, accessible controls, and automated happy-path validation.
edges:
  - from: scaffold
    to: todo-ui
    type: blocks
  - from: todo-ui
    to: filtering
    type: blocks
  - from: filtering
    to: persistence
    type: blocks
  - from: persistence
    to: validation
    type: blocks
goal: Build a simple persistent todo app
implementationGroups:
  - id: foundation
    taskIds:
      - scaffold
  - id: experience
    taskIds:
      - todo-ui
      - filtering
      - persistence
  - id: quality
    taskIds:
      - validation
lifecycle: awaiting_validation_review
planId: pln_01kxdgrhsp8z6wssqdya4vyjzx
revision: 1
tasks:
  - acceptanceCriteria:
      - The app installs and starts locally without errors.
      - The layout adapts cleanly to mobile and desktop viewport widths.
      - The project provides build, lint, and test scripts.
    description: Create a minimal Vite React TypeScript app with local scripts, semantic page shell, responsive styling foundation, and no unnecessary runtime dependencies.
    id: scaffold
    title: Scaffold React TypeScript app
    validationIntent: Run install, build, lint, and a startup smoke check.
  - acceptanceCriteria:
      - A non-empty todo can be added from the keyboard while blank or whitespace-only input is rejected.
      - Each todo can be toggled complete or active and deleted with clearly labelled controls.
      - Empty and filtered-empty states are clear, controls have semantic accessible names, and keyboard focus is visible.
    description: Build the form, list, item controls, counts, and empty states using semantic labels and keyboard-operable controls with visible focus styling.
    id: todo-ui
    title: Build accessible todo interactions
    validationIntent: Automate add, input validation, toggle, delete, accessible-name, keyboard, and focus-oriented interaction checks.
  - acceptanceCriteria:
      - All displays every todo, Active only incomplete todos, and Completed only completed todos.
      - The selected filter is visually and semantically identified.
      - Filtering updates immediately without losing todo state.
    description: Provide All, Active, and Completed filters whose current selection and resulting list are unambiguous.
    id: filtering
    title: Implement todo filters
    validationIntent: Automate the All, Active, and Completed filter paths with mixed todo states.
  - acceptanceCriteria:
      - Todos and their completion states survive reload.
      - The selected filter survives reload.
      - Malformed or unavailable localStorage does not crash the app or corrupt current in-memory state.
    description: Persist todo records and the selected filter to browser localStorage, restore them safely on reload, and tolerate malformed stored values by using a valid empty/default state.
    id: persistence
    title: Persist todos and filter
    validationIntent: Automate reload persistence for todo state and selected filter, plus a malformed-storage recovery check.
  - acceptanceCriteria:
      - Automated checks cover add, reject-empty, toggle, filtering, deletion, persistence, and accessibility-oriented keyboard interactions.
      - Lint, tests, and production build pass.
      - The runnable app has no browser console errors during the validated happy path.
    description: Add focused automated tests for the core workflow and verify production readiness with lint and build checks.
    id: validation
    title: Validate the complete happy path
    validationIntent: Run the complete automated suite, lint, build, and a browser happy-path smoke run.
version: "1"
