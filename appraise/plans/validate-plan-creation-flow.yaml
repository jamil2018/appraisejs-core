goal: Validate plan creation flow
implementationGroups:
  - id: runtime-and-create-contracts
    taskIds:
      - preflight-runtime-identity
      - happy-path-mcp-create
      - artifact-contract-validation
  - id: source-ui-events-recovery
    taskIds:
      - cli-and-file-source-paths
      - review-surface-browser
      - event-delivery-and-ack
      - concurrency-and-recovery
  - id: evidence-and-reporting
    taskIds:
      - validation-evidence-package
lifecycle: preparing_validations
planId: validate-plan-creation-flow
revision: 1
tasks:
  - acceptanceCriteria:
      - "`project_diagnostic` reports git, identity, application, authentication, and project checks with actionable status and recovery fields."
      - Plan creation is blocked when the app is unreachable, token authentication fails, or the coordinator project fingerprint does not match the running app.
      - Diagnostics do not leak coordinator tokens and report canonical project metadata only where documented.
      - Evidence records the exact command or MCP call, response status, sanitized payload, and recovery behavior for each preflight scenario.
    description: Exercise the diagnostic gates that must pass before any plan is created, including coordinator identity initialization, application reachability, authentication, project fingerprint match, clean/dirty git metadata capture, and documented recovery messaging for transport and project mismatch failures.
    id: preflight-runtime-identity
    title: Verify runtime, identity, and project ownership preflight
    validationIntent: Run MCP diagnostic and targeted API/CLI probes with valid and intentionally invalid endpoint, token, and project identity setup; verify responses against `docs/coordinator-api-mcp.md`.
  - acceptanceCriteria:
      - A valid MCP `plan_create` request creates `appraise/plans/<planId>.yaml` and the matching review artifact without manual filesystem writes.
      - "`plan_wait_for_review` returns only after a durable `plan_review_ready` event exists."
      - "`plan_read` returns the current artifact, revision, lifecycle, browser link, `appraise://plans/<planId>` link, and content hash."
      - Database projection rows for the plan, tasks, edges, revisions, and events match the created artifact.
      - The flow is repeatable with deterministic behavior for a fresh unique plan ID.
    description: "Create a representative structured plan through MCP and verify the complete successful flow: request validation, artifact creation, projection sync, durable event append, review URL availability, and exact content hash returned by `plan_read`."
    id: happy-path-mcp-create
    title: Validate MCP plan_create happy path
    validationIntent: Use MCP tools against the live app, then verify canonical artifacts, SQLite projections through existing services or read-only queries, and review-ready event delivery.
  - acceptanceCriteria:
      - Missing required fields, invalid lifecycle, unsupported version, duplicate task IDs, missing dependency endpoints, invalid edge types, and task references outside implementation groups return clear validation errors.
      - Duplicate plan IDs are rejected or handled according to the documented idempotency/ownership behavior without overwriting existing reviewed content.
      - Requests above the documented 1 MiB body limit fail safely.
      - Rejected plans do not leave partial plan artifacts, review artifacts, database projections, or durable events.
      - Error responses are useful to an agent caller and do not expose secrets or stack traces.
    description: Cover malformed, incomplete, duplicate, oversized, and semantically invalid plan creation requests across MCP/API/CLI surfaces so invalid plans fail before corrupting artifacts or projections.
    id: artifact-contract-validation
    title: Validate plan contract and rejection scenarios
    validationIntent: Submit targeted invalid payloads through the coordinator API and MCP where available; inspect filesystem/database state after each rejection.
  - acceptanceCriteria:
      - CLI-created plans wait for `plan_review_ready` before presenting stable review links.
      - Inside-project plan files resolve through realpath and create plans with coordinator fingerprint, canonical project path, and canonical source path metadata.
      - External, traversal, and symlink-resolved external source files are blocked before an API request unless the explicit external-file override is supplied.
      - Intentional external-source creation includes the documented `external-plan-source` warning.
      - "CLI stdout/stderr remains machine- and human-usable: MCP protocol traffic is never mixed with diagnostics."
    description: Exercise the CLI online creation path and file ownership guard, including inside-project plan files, traversal attempts, symlink-resolved external files, intentional external source override, and returned ownership metadata.
    id: cli-and-file-source-paths
    title: Validate CLI and file-source plan creation paths
    validationIntent: Use the repo-built `packages/appraisejs` CLI against the live app with temporary plan files inside and outside the project; compare behavior to `docs/coordinator-api-mcp.md` and `docs/cli-skills-and-recovery.md`.
  - acceptanceCriteria:
      - The plan list shows the new plan with correct goal, lifecycle, revision, and review-ready state.
      - The plan detail route loads from the returned browser URL without console errors or server errors.
      - Graph rendering reflects task dependencies; list review remains usable if graph projection is unavailable.
      - Review controls are disabled until review readiness is durable and show correct state after readiness.
      - Adding, resolving, retargeting, and blocking remarks affect approval gating as expected.
      - Approving the plan revision requires the current artifact hash and is invalidated by new blocking feedback or stale review writes.
    description: "Verify that newly created plans appear and behave correctly in the app UI: plan list entry, plan detail route, graph/list review fallback, task details, dependency rendering, review readiness state, layout controls, remarks, and approval gating."
    id: review-surface-browser
    title: Validate browser review surface after creation
    validationIntent: Run Playwright/browser validation against the returned review URL and plan list; include console/network capture and screenshots for desktop and mobile-relevant widths.
  - acceptanceCriteria:
      - Unacknowledged `plan_graph_processing_started` and `plan_review_ready` events are delivered at least once in monotonically increasing sequence order.
      - Reading events does not acknowledge them; explicit ack removes them from subsequent unacknowledged reads.
      - Acknowledging the same sequence repeatedly is idempotent.
      - "`afterSequence` and long-poll wait behavior returns the expected event subset without skipping events."
      - Approval-like events are acknowledged only after their permitted transition succeeds.
    description: Exercise event ordering and acknowledgement rules for plan creation, including repeated reads, `after` cursors, long-poll waits, idempotent acknowledgements, and superseding cancellation/progression behavior where applicable.
    id: event-delivery-and-ack
    title: Validate durable event delivery and acknowledgement semantics
    validationIntent: Use MCP `plan_events_read`, `plan_event_acknowledge`, and direct coordinator event endpoints for deterministic read/ack/long-poll checks.
  - acceptanceCriteria:
      - Heartbeat renews an active lease and expired heartbeats fail with clear recovery instructions.
      - Reconnect with the same coordinator identity works; conflicting active coordinators require explicit takeover approval where supported.
      - Concurrent duplicate plan creation attempts cannot create divergent artifacts or projections.
      - Plan creation interrupted before review readiness can recover to a consistent artifact/projection/event state or fails cleanly without residue.
      - Restarting the app preserves created plan artifacts, projection sync, review URL behavior, and event history.
    description: Test plan creation under coordinator lease and concurrency pressure, including reconnect, heartbeat, active coordinator conflicts, expired leases, simultaneous duplicate creation attempts, and app restart recovery.
    id: concurrency-and-recovery
    title: Validate concurrency, leases, and recovery behavior
    validationIntent: Use coordinator API/MCP plus controlled app restarts and concurrent requests; inspect artifacts, projections, and event sequences after each recovery scenario.
  - acceptanceCriteria:
      - Coverage matrix maps every scenario to command/API/UI evidence and pass/fail status.
      - Evidence includes created plan IDs, content hashes, lifecycle states, event sequences, browser URLs, screenshots, and relevant logs.
      - Known gaps and environment-only failures are separated from product defects.
      - Regression commands are documented so future agents can rerun focused checks quickly.
      - No implementation begins until this plan is approved and validation preparation is explicitly started.
    description: Produce a final validation package that ties each scenario to evidence, commands, artifacts, screenshots, logs, failures, and any follow-up defects needed before calling the plan creation flow fully validated.
    id: validation-evidence-package
    title: Assemble validation evidence and coverage report
    validationIntent: Collect command output, MCP responses, read-only artifact/database checks, browser screenshots, and a concise final report after approved validation execution.
version: "1"
