description: Fully validate AppraiseJS plan creation from coordinator preflight through durable review readiness, artifact persistence, plan listing/review UI, event delivery, and negative/recovery paths. The outcome is an evidence-backed validation matrix that exercises the app's plan creation flow through MCP, CLI/API, stored artifacts, database projections, and browser-visible review surfaces without moving into implementation until the plan is approved.
