    to: happy-path-mcp-create
    type: depends-on
  - from: happy-path-mcp-create
    to: artifact-contract-validation
    type: depends-on
  - from: happy-path-mcp-create
    to: cli-and-file-source-paths
    type: depends-on
  - from: happy-path-mcp-create
    to: review-surface-browser
    type: depends-on
  - from: happy-path-mcp-create
