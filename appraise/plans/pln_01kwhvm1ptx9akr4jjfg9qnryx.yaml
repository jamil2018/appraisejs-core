description: Create a polished single-page inventory management app in /Users/jamil/Personal Projects/simple-inventory using React 19 with TypeScript as a Vite single-page app, Tailwind CSS, and shadcn/ui. This is a client-rendered SPA, not Next.js or a server-rendered React framework. The app should support tracking inventory items with add, edit, delete, search/filter, stock status, category grouping, summary metrics, and localStorage persistence. Validation will include lint/build checks plus Playwright e2e coverage for the core inventory workflows, with Appraise validation evidence published after plan approval.
edges:
  - from: scaffold-react-tailwind-shadcn
    to: inventory-data-model-form
    type: blocks
  - from: inventory-data-model-form
    to: inventory-table-actions
    type: blocks
  - from: inventory-table-actions
