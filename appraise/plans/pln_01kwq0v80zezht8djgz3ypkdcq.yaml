tasks:
  - acceptanceCriteria:
      - The project has package metadata, npm scripts, Vite config, TypeScript config, and React entry points for the selected stack and versions.
      - The app can start locally through the dev script and can run a production build without missing dependencies.
      - The file structure separates geolocation access, weather API normalization, presentational components, and validation tests.
    description: Create a Vite 7.x React single-page app using TypeScript 6.0.3, React 19.2.7, react-dom 19.2.7, npm scripts, and a small component/service structure for weather data, geolocation, UI state, and tests. Use scoped or modular CSS rather than adding a large UI framework for this small project.
    id: scaffold-setup
    title: Scaffold the React weather app stack
    validationIntent: Run npm install if needed, then run the app build and any scaffold smoke checks available in the target workspace.
  - acceptanceCriteria:
      - Users can trigger a current-location request from the primary screen without entering any location text.
      - "The UI explains and handles supported states: not requested, requesting permission, resolving location, permission denied, unavailable/timeout, and successful coordinates."
      - Retry or refresh is available after denied/unavailable/error states without a page reload.
      - Unit selection, if implemented, does not block the location flow and defaults to a sensible value.
    description: Implement the browser Geolocation API flow. The primary screen asks the user to share current location, then requests coordinates with sensible timeout and accuracy settings. The user is not asked to fill a text field. Controls are limited to a Use current location action, retry/refresh after failures, and an optional Celsius/Fahrenheit unit toggle.
    id: location-permission-flow
    title: Build the location permission flow
    validationIntent: Use mocked geolocation in tests or browser checks to cover success, denied permission, timeout/unavailable, and retry behavior.
  - acceptanceCriteria:
      - Successful coordinate resolution triggers a weather fetch for the user's latitude/longitude.
      - The integration uses an API-key-free endpoint and keeps all network details behind a small service function.
      - Loading, network error, API error, and unexpected response-shape failures are shown as recoverable app states.
      - Weather condition codes are mapped to readable labels rather than shown raw.
    description: Call Open-Meteo with the resolved latitude/longitude and requested units, then normalize the response into a UI-friendly current weather model including temperature, apparent temperature when available, condition code/label, wind speed/direction, precipitation or humidity when available, observation time, and source/update metadata.
    id: weather-api-integration
    title: Fetch and normalize current weather
    validationIntent: Use deterministic mocked fetch responses for current weather success, network failure, malformed response, and unit changes.
  - acceptanceCriteria:
      - After a successful request, users see a clear current-conditions summary for their current location.
      - The layout works on mobile and desktop without text overlap or controls shifting unexpectedly.
      - The result view includes refresh and unit controls, and preserves understandable empty/loading/error states.
      - Sensitive exact coordinates are not overemphasized; if displayed, they are rounded and secondary.
    description: Create a responsive weather dashboard that shows the user's current local weather, approximate location/coordinates or resolved place label when available, current temperature, condition, feels-like temperature, wind, precipitation/humidity metadata, and last updated time. Keep the first screen focused on the usable weather result rather than a marketing hero.
    id: result-rendering
    title: Render current local weather clearly
    validationIntent: Verify rendered loading, success, error, and responsive states with component tests or a lightweight browser check.
  - acceptanceCriteria:
      - Build, lint or typecheck, and focused tests pass, or any unavailable check is documented with a clear reason.
      - Geolocation success, permission denial, timeout/unavailable, API success, API failure, and malformed API response are covered by deterministic evidence.
      - The final handoff documents how to run the app locally and what was verified.
    description: Add or run validation covering app startup, geolocation permission outcomes, weather API normalization, unit selection, loading/error states, and result rendering. Prefer deterministic mocks for geolocation and fetch so validation does not depend on the operator's live location or the external API being available.
    id: validation
    title: Validate the weather workflow
    validationIntent: Run npm build/typecheck plus focused Vitest tests; use Playwright with mocked geolocation only if browser-level evidence is practical.
version: "1"
