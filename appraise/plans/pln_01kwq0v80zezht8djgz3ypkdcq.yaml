description: "Create a simple client-side weather app for /Users/jamil/Personal Projects/weather-guy. The app uses the browser Geolocation API to request the user's current latitude/longitude, fetches current weather for those coordinates, and renders a polished current-conditions view. Planned stack: Vite 7.x React SPA, React 19.2.7 with react-dom 19.2.7, TypeScript 6.0.3, plain CSS modules or scoped CSS with no backend service, npm scripts for dev/build/test, Vitest for focused unit tests, and Playwright only if browser-level validation is needed. Weather data will use Open-Meteo current weather/forecast APIs because they support latitude/longitude requests without an API key. The app will not require the user to type an address or search query; the requested user action is location permission, with optional refresh and unit controls."
