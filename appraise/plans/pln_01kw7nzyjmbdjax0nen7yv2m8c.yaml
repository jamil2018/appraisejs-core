description: Build a Vite React todo application with TailwindCSS, shadcn/ui, TanStack Form, local task persistence, and AppraiseJS-backed E2E validation.
edges:
  - from: scaffold-app
    to: task-model
    type: blocks
  - from: task-model
    to: task-crud-ui
    type: blocks
  - from: task-crud-ui
    to: forms-validation
    type: relates-to
  - from: forms-validation
    to: appraise-e2e
    type: blocks
goal: Simple Todo App
implementationGroups:
  - id: app-foundation
    taskIds:
      - scaffold-app
      - task-model
  - id: todo-experience
    taskIds:
      - task-crud-ui
      - forms-validation
  - id: appraise-validation
    taskIds:
      - appraise-e2e
lifecycle: awaiting_plan_review
planId: pln_01kw7nzyjmbdjax0nen7yv2m8c
revision: 1
tasks:
  - acceptanceCriteria:
      - The workspace has a runnable Vite React TypeScript app.
      - TailwindCSS styles are loaded globally.
      - shadcn/ui configuration and shared utilities are present.
      - Required dependencies include React, Vite, TailwindCSS, shadcn/ui dependencies, lucide-react, and TanStack Form.
    description: Initialize the empty workspace with a React TypeScript Vite app and configure package scripts, TypeScript, TailwindCSS, and shadcn/ui foundations.
    id: scaffold-app
    title: Scaffold the Vite React application
    validationIntent: Verify the app starts, builds, and renders the initial todo interface without runtime errors.
  - acceptanceCriteria:
      - Tasks use id, title, completed, createdAt, and updatedAt fields.
      - Tasks are stored under the localStorage key simple-todo.tasks.v1.
      - Malformed stored task data is ignored safely and resets to an empty list.
      - Task changes are persisted after create, edit, delete, and complete actions.
    description: Define the todo task model and localStorage persistence layer so task data survives browser reloads and new sessions.
    id: task-model
    title: Implement task state and persistence
    validationIntent: Reload the browser after each core task mutation and confirm the expected state is restored.
  - acceptanceCriteria:
      - Users can create a task with a non-empty title.
      - Users can edit an existing task title.
      - Users can delete a task.
      - Users can mark a task completed and uncompleted.
      - Completed tasks are visually distinct from active tasks.
    description: Create a focused todo interface with task creation, editing, deletion, completion toggles, and clear empty and completed states using shadcn/ui components.
    id: task-crud-ui
    title: Build the todo interaction UI
    validationIntent: Exercise each user workflow through the rendered UI and confirm the visible task list updates immediately.
  - acceptanceCriteria:
      - The create form uses TanStack Form.
      - The edit form uses TanStack Form.
      - Empty task titles are rejected with a visible validation message.
      - Successful submit clears or closes the relevant form.
    description: Implement task creation and editing forms with TanStack Form, including required-title validation and accessible labels or names.
    id: forms-validation
    title: Use TanStack Form for task forms
    validationIntent: Try empty and valid submissions for create and edit workflows and confirm validation behavior.
  - acceptanceCriteria:
      - The plan is visible in AppraiseJS for review and approval.
      - E2E validation covers create, edit, delete, complete, and persistence across reload.
      - The implementation is not considered complete until AppraiseJS validation evidence is recorded.
    description: Use AppraiseJS as the planning and E2E testing surface for the completed todo app, including validation artifacts for the main user flows.
    id: appraise-e2e
    title: Publish and run AppraiseJS E2E validation
    validationIntent: Run AppraiseJS-backed E2E tests against the local Vite app and record passing evidence.
version: '1'
