description: |-
  Create a simple inventory management system that allows users to keep track of stock, store sales records, and track income. The app should support managing inventory items, recording sales transactions that adjust stock levels, and summarizing income from sales in a clear dashboard/reporting view.

  Target workspace is /Users/jamil/Personal Projects/invatore. This appears to be a newly registered or empty target; propose a practical small-app implementation plan with explicit stack choices, persistence approach, UI workflows, validation strategy, and assumptions. Prioritize a usable first version: inventory list/add/edit/delete, stock quantity tracking, sale entry with quantity validation and automatic stock decrement, sales history, and income totals. Include handling for low/out-of-stock states, invalid sales, and local persistence appropriate for a simple app unless repository context indicates a different existing stack.
