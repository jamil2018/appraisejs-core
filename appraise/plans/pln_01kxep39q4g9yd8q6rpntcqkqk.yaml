    to: scaffold
    type: depends-on
  - from: persistence
    to: todo-interactions
    type: depends-on
  - from: accessibility-responsive
    to: todo-interactions
    type: depends-on
  - from: validation
    to: persistence
    type: depends-on
  - from: validation
    to: accessibility-responsive
    type: depends-on
goal: Build a responsive, accessible persistent todo app
