  - id: foundation
    taskIds:
      - scaffold
  - id: product
    taskIds:
      - todo-interactions
      - persistence
      - accessibility-responsive
  - id: verification
    taskIds:
      - validation
lifecycle: awaiting_validation_review
planId: pln_01kxep39q4g9yd8q6rpntcqkqk
