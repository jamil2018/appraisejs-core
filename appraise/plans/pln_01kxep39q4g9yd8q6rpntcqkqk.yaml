          taskId: todo-interactions
        - surface: acceptanceCriteria
          taskId: validation
      id: completion
      kind: functional
      text: Toggle todos complete and incomplete
    - coveredBy:
        - surface: acceptanceCriteria
          taskId: todo-interactions
        - surface: acceptanceCriteria
          taskId: validation
