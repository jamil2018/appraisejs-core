description: Build a simple polished todo web app with React, TypeScript and Vite. Add, complete/reactivate, delete, filter All/Active/Completed, clear completed, localStorage persistence, selected-filter persistence, empty state, remaining count, accessible keyboard controls and focus states. The responsive layout must remain usable without horizontal scrolling at a 375px mobile viewport and desktop widths. Add unit/component tests and Playwright happy-path coverage.
