tasks:
  - acceptanceCriteria:
      - The app starts locally with React, Vite and no missing dependency errors.
      - Base styling, component primitives, and project structure are in place for the planned UI.
      - Stack assumptions are stated clearly in the review-ready plan.
    description: Create the React, Vite application foundation, install required UI/data dependencies, and wire the base layout, routing, and styling entry points requested by the brief. These defaults are reviewable through Appraise feedback when the brief does not name a stack.
    id: scaffold-setup
    title: Scaffold and configure the app shell
    validationIntent: Run install/build or the closest available scaffold validation for the generated app shell.
  - acceptanceCriteria:
      - The UI exposes a clear todo list, empty state, and input flow.
      - todo data includes the fields needed for titles and completion state.
    description: Define the todo shape, app state boundaries, and visible list/form experience for creating, viewing, and organizing items.
    id: task-model-ui
    title: Model todo data and build the primary UI
    validationIntent: Exercise the main UI states manually or with component-level tests where available.
  - acceptanceCriteria:
      - Users can add and delete todo items.
      - Users can mark todo items complete or incomplete.
    description: Add only the item operations explicitly requested by the brief, with predictable state updates.
    id: crud-completion
    title: Implement requested todo behavior
    validationIntent: Run focused interaction tests or manually verify each CRUD and completion path.
  - acceptanceCriteria:
      - Users can switch between all, active, and completed todo items.
      - Filtering changes only the visible subset and preserves item state.
    description: Add the requested all, active, and completed views without changing stored todo state.
    id: filtering
    title: Filter todo items
    validationIntent: Verify each filter against mixed active and completed data.
  - acceptanceCriteria:
      - todo items survive a page reload or app restart according to the selected persistence layer.
      - Persistence failures do not corrupt the visible in-memory state.
    description: Store todo data using the persistence approach requested by the brief, and restore saved state on reload.
    id: persistence
    title: Persist todo state
    validationIntent: Verify saved items and completion state reload correctly.
  - acceptanceCriteria:
      - The primary workflow remains usable at narrow viewport sizes.
      - Inputs, toggles, filters, and delete controls have accessible names and keyboard focus states.
    description: Preserve the requested workflow across small screens, keyboard navigation, and assistive technology.
    id: quality
    title: Polish accessible responsive todo workflows
    validationIntent: Run responsive viewport and accessibility-focused interaction checks.
  - acceptanceCriteria:
      - The happy path from app launch through persisted completed items is verified.
      - Relevant lint, unit, component, or end-to-end checks pass or have documented follow-up gaps.
    description: Add or run validation that covers startup, primary UI rendering, CRUD behavior, completion toggles, and persistence recovery.
    id: validation
    title: Validate the planned user workflow
    validationIntent: Run the focused test suite plus lint/build checks appropriate for the created app.
version: "1"
