<style>
#jw{--w-bg:light-dark(#f4f5f7,#10151e);--w-paper:light-dark(#fff,#18202b);--w-ink:light-dark(#172132,#e6eaf1);--w-sub:light-dark(#526073,#a8b4c5);--w-line:light-dark(#cdd3dc,#394554);--w-soft:light-dark(#eef1f5,#242e3b);--w-primary:light-dark(#243447,#dce4ee);--w-on:light-dark(#fff,#152131);--w-alert:light-dark(#f6efdf,#302b21);font:14px/1.55 system-ui,sans-serif;color:var(--w-ink)}
#jw *{box-sizing:border-box}#jw button,#jw select,#jw textarea,#jw input{font:inherit}#jw button,#jw select{cursor:inherit}#jw button{min-height:38px;border:1px solid var(--w-line);border-radius:6px;padding:8px 13px;background:var(--w-paper);color:var(--w-ink)}#jw button:disabled{opacity:.45;cursor:not-allowed}#jw .primary{background:var(--w-primary);color:var(--w-on);border-color:var(--w-primary)}#jw .plain{border-color:transparent;background:transparent;padding-left:0;padding-right:0;text-decoration:underline;text-underline-offset:3px}#jw .preview{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0 18px;padding-right:90px}#jw .preview label{font-weight:500}#jw select{max-width:100%;padding:8px 10px;border:1px solid var(--w-line);border-radius:6px;background:var(--w-paper);color:var(--w-ink)}#jw .preview-note{color:var(--w-sub);font-size:12px}#jw .window{border:1px solid var(--w-line);border-radius:10px;background:var(--w-bg);overflow:hidden;max-width:100%;margin:auto}#jw .appbar{padding:14px 24px;background:var(--w-paper);border-bottom:1px solid var(--w-line);display:flex;align-items:center;gap:22px}#jw .brand{font-weight:650;letter-spacing:-.5px}#jw .appnav{color:var(--w-sub);font-size:13px}#jw .content{max-width:850px;margin:auto;padding:25px 32px 20px}#jw .backrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px}#jw h1{font-size:23px;line-height:1.3;margin:8px 0;font-weight:600;letter-spacing:-.45px}#jw h2{font-size:23px;line-height:1.3;margin:0 0 8px;font-weight:550;letter-spacing:-.4px}#jw h3{font-size:14px;margin:0 0 6px;font-weight:600}#jw p{margin:0 0 13px}#jw .meta{color:var(--w-sub);font-size:13px}#jw .steps{display:grid;grid-template-columns:repeat(6,1fr);list-style:none;margin:22px 0;padding:0;gap:8px}#jw .steps li{border-top:3px solid var(--w-line);padding-top:9px;font-size:12px;color:var(--w-sub)}#jw .steps li[aria-current=step]{border-color:var(--w-ink);color:var(--w-ink);font-weight:600}#jw .steps .done{border-color:var(--w-sub)}#jw .task{background:var(--w-paper);border:1px solid var(--w-line);border-radius:8px;padding:27px 29px;min-height:330px}#jw .eyebrow{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:13px;color:var(--w-sub)}#jw .intro{color:var(--w-sub);max-width:570px}#jw .body{margin:23px 0}#jw .two{display:grid;grid-template-columns:1fr 1fr;gap:24px}#jw ul{padding-left:19px;margin:6px 0}#jw .row{padding:14px 0;border-bottom:1px solid var(--w-line)}#jw .row:last-child{border-bottom:0}#jw label.option{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border:1px solid var(--w-line);border-radius:6px;margin:9px 0}#jw input[type=checkbox],#jw input[type=radio]{width:17px;height:17px;flex-shrink:0;margin-top:3px;accent-color:var(--w-ink)}#jw textarea,#jw input[type=text]{width:100%;border:1px solid var(--w-line);border-radius:6px;background:var(--w-paper);color:var(--w-ink);padding:10px 12px;display:block;margin-top:7px}#jw textarea{min-height:78px;resize:vertical}#jw .field{display:block;margin-top:17px}#jw .notice{background:var(--w-soft);border-left:3px solid var(--w-sub);padding:13px 15px;margin:15px 0}#jw .caution{background:var(--w-alert)}#jw .actions{border-top:1px solid var(--w-line);padding-top:19px;display:flex;flex-wrap:wrap;align-items:center;gap:13px}#jw .next{font-size:12px;color:var(--w-sub);margin:13px 0 0}#jw .secondary{display:flex;flex-wrap:wrap;gap:23px;padding:16px 0 4px}#jw .secondary button{font-size:12px}#jw .fact{display:grid;grid-template-columns:135px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--w-line)}#jw .fact span{color:var(--w-sub)}#jw details{margin:9px 0}#jw summary{cursor:inherit;text-decoration:underline;text-underline-offset:3px}#jw .scenario{display:grid;grid-template-columns:25px 1fr;gap:9px;padding:12px 0;border-bottom:1px solid var(--w-line)}#jw .scenario label{font-weight:500}#jw .small{font-size:12px;color:var(--w-sub)}#jw .state-number{margin-left:auto;color:var(--w-sub);font-size:12px}#jw .feedback{margin-top:16px}#jw .previewfooter{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px}#jw .aux{background:var(--w-paper);border:1px solid var(--w-line);border-radius:6px;padding:16px;margin-top:10px}#jw .mobile{max-width:390px}#jw .mobile .content{padding:18px 16px}#jw .mobile .appnav{display:none}#jw .mobile .steps{grid-template-columns:repeat(3,1fr)}#jw .mobile .task{padding:20px 16px}#jw .mobile .two{grid-template-columns:1fr}#jw .mobile h1{font-size:20px}#jw .mobile .fact{grid-template-columns:1fr;gap:2px}#jw .mobile .secondary{gap:12px}#jw .mobile .actions{align-items:stretch;flex-direction:column}#jw .mobile button{min-height:44px}
@media(max-width:560px){#jw .content{padding:18px 15px}#jw .task{padding:22px 17px}#jw .steps{grid-template-columns:repeat(3,1fr)}#jw .two{grid-template-columns:1fr}#jw .appnav{display:none}#jw .fact{grid-template-columns:1fr;gap:2px}#jw .preview{padding-right:0}#jw h1{font-size:20px}#jw .secondary{gap:12px}#jw button{min-height:44px}}
</style>
<div id="jw">
  <div class="preview"><label for="jw-picker">Wireframe state</label><select id="jw-picker" aria-label="Preview Journey state"></select><span class="preview-note">Illustrative data · No live actions</span></div>
  <div class="window" id="jw-window">
    <div class="appbar"><span class="brand">Appraise</span><span class="appnav">Storefront / Quality Journeys</span><span class="state-number">Guided Journey</span></div>
    <div class="content">
      <div class="backrow"><span class="meta">← Quality Journeys</span><button id="jw-pause" type="button">Pause Journey</button></div>
      <h1>Checkout works for returning customers</h1><div class="meta">Storefront · Staging</div>
      <ol class="steps" id="jw-steps" aria-label="Journey stages"></ol>
      <section class="task" id="jw-task" aria-label="Current Journey task"></section>
      <div class="secondary"><button class="plain" data-go="history">Previous decisions</button><button class="plain" data-aux="evidence">Files and evidence</button><button class="plain" data-aux="technical">Technical details</button></div>
      <section class="aux" id="jw-aux" hidden></section>
    </div>
  </div>
  <div class="previewfooter"><button id="jw-prev">← Previous wireframe</button><span class="preview-note" id="jw-count"></span><button id="jw-next">Next wireframe →</button></div>
</div>
<script>
(()=>{
const root=document.getElementById('jw'), task=root.querySelector('#jw-task'), picker=root.querySelector('#jw-picker');
const titles=['Your brief','Test approach','Test scenarios','Test preparation','Run tests','Results'];
const states=[
{id:'brief',name:'Brief review',stage:0,kicker:'Ready to begin',title:'Review your testing brief',intro:'Confirm what you want to test before Appraise starts working.',body:`<div class="fact"><span>Goal</span><strong>Returning customers can complete checkout</strong></div><div class="fact"><span>Target</span>Storefront staging</div><div class="fact"><span>In scope</span>Successful payment, declined payment, required address fields</div><div class="fact"><span>Out of scope</span>Guest checkout and live payments</div>`,actions:[['Confirm and start Journey','working']],next:'Appraise will prepare a test approach. You can leave and return.'},
{id:'working',name:'Background work',stage:1,kicker:'Working · No action needed',title:'Preparing your test approach',intro:'Appraise is reviewing the brief and identifying the checks that matter.',body:`<div class="row">Requirements loaded <span class="small">· confirmed</span></div><div class="row">Preparing proposed coverage <span class="small">· in progress</span></div><p class="small" style="margin-top:20px">You can leave this page and return later.</p>`,actions:[],next:'Next: answer any questions, then review the proposed approach.'},
{id:'question',name:'Clarification',stage:1,kicker:'Your input is needed',title:'One detail before we continue',intro:'Should checkout include saved payment methods?',body:`<label class="option"><input type="radio" name="payment" value="include">Yes, include saved payment methods</label><label class="option"><input type="radio" name="payment" value="exclude">No, use a newly entered card only</label><label class="field">Additional context <span class="small">(optional)</span><textarea placeholder="Anything else we should know?"></textarea></label>`,actions:[['Save answer','approach','answer']],next:'Saving your answer updates the proposed approach. It does not approve it.'},
{id:'approach',name:'Approach review',stage:1,kicker:'Review · Version 2',title:'Does this approach cover your goal?',intro:'Based on your brief and answers. Your decision applies to this version.',body:`<div class="two"><div><h3>We will check</h3><ul><li>Successful signed-in checkout</li><li>Declined card handling</li><li>Required address fields</li></ul></div><div><h3>Not covered</h3><ul><li>Guest checkout</li><li>Saved payment methods</li><li>Live payment processing</li></ul></div></div><details><summary>Assumptions and full approach</summary><p>Use staging and test payment data. Check order confirmation and clear error messages. No production orders.</p></details>`,actions:[['Approve this approach','discovery'],['Request changes','feedback']],next:'Next: Appraise inspects staging and prepares test scenarios.'},
{id:'stale',name:'Review updated elsewhere',stage:1,kicker:'Version 2 · An update is available',title:'Your review has a newer version',intro:'The version you opened stays visible. Load the latest approach before deciding.',body:`<div class="notice">Version 3 is ready. Your notes are preserved; previous approval choices will not carry over automatically.</div><div class="two"><div><h3>You are viewing</h3><p>Version 2: newly entered card only</p></div><div><h3>New revision</h3><p>Version 3: saved cards are now included</p></div></div><label class="field">Your review notes<textarea>Check how expired saved cards are handled.</textarea></label>`,actions:[['Load latest version','latest']],next:'Loading the new version does not approve it.'},
{id:'discovery',name:'Target inspection',stage:2,kicker:'Working · No action needed',title:'Inspecting your test target',intro:'Appraise is checking the pages and available test resources for your approved approach.',body:`<div class="fact"><span>Target</span>Storefront staging</div><div class="fact"><span>Scope</span>Sign-in, basket and checkout</div><div class="row">Matching existing test resources</div>`,actions:[],next:'If access is needed, Appraise will ask here. Otherwise scenarios come next.'},
{id:'access',name:'Protected access',stage:2,kicker:'Action needed · Access',title:'Sign in to the test target',intro:'Checkout requires a signed-in test account. Use the scoped browser to provide access.',body:`<div class="fact"><span>Environment</span>Storefront staging</div><div class="fact"><span>Allowed area</span>Sign-in and checkout</div><div class="notice">Enter your credentials in the target browser only. They do not belong in Journey forms.</div>`,actions:[['Open test browser','accessconfirm']],next:'After signing in, return here to confirm access.'},
{id:'scenarios',name:'Scenario review',stage:2,kicker:'Review · 3 pending scenarios',title:'Choose the scenarios to approve',intro:'Review the expected behavior. Approval applies only to your selected scenarios.',body:['Successful checkout','Declined payment','Required address fields'].map((s,i)=>`<div class="scenario"><input type="checkbox" id="jw-s${i}" data-scenario><div><label for="jw-s${i}">${s}</label><details><summary class="small">View steps and expected result</summary><p>${['Sign in, add an item, enter test card details and place the order. An order confirmation is displayed.','Attempt payment with a declined test card. A clear error appears and the customer can try again.','Submit checkout with a required address field empty. The field is identified and no order is placed.'][i]}</p></details></div></div>`).join('')+`<p class="small" id="jw-selected" style="margin-top:14px">0 scenarios selected · All required coverage represented</p>`,actions:[['Approve selected scenarios','preparing','selection'],['Add feedback','feedback']],next:'Preparation begins only when the portfolio’s decisions and coverage checks are complete.'},
{id:'preparing',name:'Test preparation',stage:3,kicker:'Working · No action needed',title:'Preparing the approved tests',intro:'Appraise is connecting the scenarios to ready test operations.',body:`<div class="row">3 scenarios approved</div><div class="row">Preparing runnable checks</div><div class="notice">No tests have started. You will review the run setup and any required permission first.</div>`,actions:[],next:'Next: review where the tests will run and what they can change.'},
{id:'setup',name:'Run setup',stage:4,kicker:'Ready for your review',title:'Review this test run',intro:'Check the target and effects before reviewing permission.',body:`<div class="fact"><span>Target</span><strong>Storefront staging</strong></div><div class="fact"><span>Scope</span>3 approved checkout scenarios</div><div class="fact"><span>Browser</span>Chromium</div><div class="fact"><span>Account</span>Configured staging test account</div><div class="notice caution"><strong>Expected effects</strong><br>Creates test orders and submits test payments. No live charges are intended.</div>`,actions:[['Review required permission','permission']],next:'This opens the permission review; it does not launch tests.'},
{id:'permission',name:'Execution permission',stage:4,kicker:'Permission required · Exact run scope',title:'Allow these test actions?',intro:'Permission applies to this run in staging, with the scope below.',body:`<ul><li>Use the configured staging test account</li><li>Create orders for the three approved scenarios</li><li>Submit payments through the test payment provider</li></ul><div class="notice">Changing the target or test scope requires a new permission check. Reruns do not silently reuse this permission.</div>`,actions:[['Allow this scope','ready'],['Back to run setup','setup']],next:'Next: the run becomes eligible to start. Permission alone does not start it.'},
{id:'ready',name:'Ready to run',stage:4,kicker:'Permission recorded',title:'Your test run is ready',intro:'The recorded permission matches this run’s target and scope.',body:`<div class="fact"><span>Environment</span>Storefront staging</div><div class="fact"><span>Checks</span>3 approved scenarios</div><div class="fact"><span>Effects</span>Test orders and test payments</div>`,actions:[['Start this run','running'],['Change setup','setup']],next:'Appraise will run the tests and prepare results from the recorded evidence.'},
{id:'running',name:'Tests running',stage:4,kicker:'Running · No action needed',title:'Checking your checkout flow',intro:'Results will appear after the run finishes and its evidence is processed.',body:`<div class="row">Successful checkout <span class="small">· passed</span></div><div class="row">Declined payment <span class="small">· running</span></div><div class="row">Required address fields <span class="small">· queued</span></div>`,actions:[['Stop this test run','stopping']],next:'You can leave this page. Stopping requires confirmation of the run’s termination.'},
{id:'results',name:'Results and corrections',stage:5,kicker:'Review results · Version 1',title:'Two checks need attention',intro:'1 passed · 1 failed · 1 inconclusive. Review the findings before choosing what follows.',body:`<div class="row"><h3>Declined card message was not found</h3><p>The expected error was not observed. The report proposes checking the locator binding.</p></div><div class="row"><h3>Address validation was inconclusive</h3><p>The run ended before an outcome was confirmed.</p></div><div class="notice"><strong>Proposed correction</strong><br>Revise the declined-payment locator binding and prepare a scoped follow-up run. No product-code change is proposed.</div><label class="field">Decision rationale <span class="small">(required to approve corrections)</span><textarea id="jw-rationale" placeholder="Why is this correction appropriate?"></textarea></label>`,actions:[['Approve proposed corrections','correction','rationale'],['Request report changes','feedback'],['Review and accept remaining risks','risk']],next:'Corrections and risk acceptance are separate choices. A new run still needs its applicable permission.'},
{id:'risk',name:'Explicit risk acceptance',stage:5,kicker:'Decision · Remaining risks',title:'Finish with these unresolved risks?',intro:'The Journey can close with accepted risks. The failed and inconclusive results will remain visible.',body:`<label class="option"><input type="checkbox" data-risk>Acknowledge the unverified declined-payment message</label><label class="option"><input type="checkbox" data-risk>Acknowledge inconclusive address validation</label><label class="field">Why are these risks acceptable?<textarea id="jw-risk-reason" placeholder="Record your decision rationale"></textarea></label>`,actions:[['Accept risks and finish Journey','closed','risk'],['Back to results','results']],next:'This records closure for this report version. It does not mark the tests as passed.'},
{id:'recovery',name:'Unknown outcome',stage:4,kicker:'Recovery required',title:'Progress needs checking',intro:'Appraise cannot confirm whether the last operation completed.',body:`<div class="notice caution">Another attempt is blocked to avoid repeating the action.</div><p>Your brief, approved scenarios and recorded decisions are saved.</p><details><summary>What happened?</summary><p>The acknowledgement was interrupted. No successful completion or safe retry has been confirmed.</p></details>`,actions:[['Check operation outcome','checkunknown']],next:'Resume is available only after the outcome and owned-resource status are reconciled.'},
{id:'paused',name:'Paused',stage:4,kicker:'Paused · Cleanup confirmed',title:'This Journey is paused',intro:'Your decisions and evidence are preserved. No new work is being admitted.',body:`<div class="fact"><span>Reason</span>Waiting for the staging environment to be ready</div><div class="fact"><span>Cleanup</span>Owned resources confirmed stopped</div><div class="notice">Resume rechecks current scope and pending work. It does not repeat an uncertain operation.</div>`,actions:[['Resume Journey','ready']],next:'This illustrative state assumes recovery checks have passed.'},
{id:'history',name:'Read-only history',stage:1,kicker:'Earlier decision · Read only',title:'Test approach — version 1',intro:'This version was replaced by version 2. Its original content and decision remain available.',body:`<div class="fact"><span>Decision</span>Revision requested</div><div class="fact"><span>Feedback</span>Exclude guest checkout and use a new test card</div><div class="fact"><span>Original scope</span>Signed-in and guest checkout</div><div class="notice">Viewing an earlier step does not change the current Journey or reactivate old approvals.</div>`,actions:[['Return to current step','return']],next:'Earlier versions are available for reference only.'},
{id:'closed',name:'Closed with accepted risks',stage:5,kicker:'Journey closed · Risks accepted',title:'Testing completed with remaining risks',intro:'1 passed · 1 failed · 1 inconclusive. Closure records your decision, not a passing result.',body:`<div class="row"><h3>Accepted risks</h3><p>Declined-payment messaging and address validation remain unresolved.</p></div><div class="row"><h3>Evidence retained</h3><p>Reviewed report, run evidence and decision rationale.</p></div>`,actions:[['View recorded decision','decision']],next:'A follow-up Journey can address the remaining risks without rewriting this history.'}
];
let current='approach',returnState='approach',transient=null; const custom={};
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
states.forEach(s=>{let o=document.createElement('option');o.value=s.id;o.textContent=s.name;picker.append(o)});
function render(id){const s=custom[id]||states.find(s=>s.id===id);if(!s)return; current=id;picker.value=states.some(x=>x.id===id)?id:'';root.querySelector('#jw-aux').hidden=true;root.querySelector('#jw-steps').innerHTML=titles.map((t,i)=>`<li ${i===s.stage?'aria-current="step"':''} class="${i<s.stage?'done':''}">${i<s.stage?'✓ ':''}${t}</li>`).join('');root.querySelector('#jw-pause').hidden=['closed','history','paused','pauseform'].includes(id);task.innerHTML=`<div class="eyebrow">${s.kicker}</div><h2>${s.title}</h2><p class="intro">${s.intro}</p><div class="body">${s.body}</div>${s.actions.length?`<div class="actions">${s.actions.map((a,i)=>`<button type="button" class="${i===0?'primary':'plain'}" data-go="${a[1]}" ${a[2]?`data-require="${a[2]}" disabled`:''}>${a[0]}</button>`).join('')}</div>`:''}<p class="next">${s.next}</p><p class="feedback small" role="status" id="jw-feedback"></p>`; const index=states.findIndex(x=>x.id===id);root.querySelector('#jw-count').textContent=index<0?'Interaction preview':`${index+1} / ${states.length} states`;update();}
function update(){const checks=[...task.querySelectorAll('[data-scenario]')],selected=checks.filter(x=>x.checked&&!x.disabled).length;const count=task.querySelector('#jw-selected');if(count)count.textContent=`${selected} scenarios selected · All required coverage represented`;task.querySelectorAll('[data-require]').forEach(b=>{const r=b.dataset.require;b.disabled=r==='answer'?!task.querySelector('input[name=payment]:checked'):r==='selection'?!selected:r==='rationale'?!task.querySelector('#jw-rationale')?.value.trim():r==='risk'?!(task.querySelectorAll('[data-risk]:checked').length===2&&task.querySelector('#jw-risk-reason')?.value.trim()):r==='text'?!task.querySelector('textarea')?.value.trim():false;});}
function go(id){if(id==='return'){render(returnState);return}if(id==='history'){returnState=current;render(id);return}if(id==='feedback'){returnState=current;custom.feedback={stage:(custom[current]||states.find(s=>s.id===current)).stage,kicker:'Request a revision',title:'What should change?',intro:'Your feedback applies to the version you were reviewing.',body:`<label class="field">Changes requested<textarea placeholder="Describe the change and why it matters"></textarea></label>`,actions:[['Submit feedback','revisionwaiting','text'],['Back to review','return']],next:'Appraise creates revision work. This does not approve the current artifact.'};render(id);return}if(id==='pauseform'){returnState=current;custom.pauseform={stage:(custom[current]||states.find(s=>s.id===current)).stage,kicker:'Operational control',title:'Pause this Journey?',intro:'New work will be fenced before owned resources are stopped.',body:`<label class="field">Reason for pausing<textarea placeholder="What should be recorded?"></textarea></label>`,actions:[['Request pause','pausepending','text'],['Keep working','return']],next:'A pause request is not proof that cleanup has finished.'};render(id);return}if(id==='pausepending'||id==='stopping'){custom[id]={stage:4,kicker:'Stopping · Confirmation pending',title:'Waiting for owned work to stop',intro:'No new work will be admitted. Appraise is checking the outcome of active operations.',body:'<div class="notice">Cancellation requested. Termination and cleanup have not yet been confirmed.</div>',actions:[],next:'If cleanup cannot be verified, the Journey remains in recovery.'};render(id);return}if(id==='accessconfirm'){custom[id]={stage:2,kicker:'Protected access',title:'Confirm access after signing in',intro:'The prototype does not open a real browser. In the product, sign in through the scoped target browser.',body:'<p>Confirm only when the target browser has returned to the permitted checkout area.</p>',actions:[['Confirm access','discovery'],['Back','access']],next:'The service validates the session and exact target before accepting access.'};render(id);return}if(id==='revisionwaiting'){custom[id]={stage:(custom[current]||states.find(s=>s.id===current)).stage,kicker:'Revision requested',title:'Your feedback is recorded',intro:'Appraise will revise the artifact you reviewed. Your prior decisions remain in history.',body:'<div class="notice">No approval was recorded. The revised artifact will need its own review.</div>',actions:[],next:'Next: review the updated version when it is ready.'};render(id);return}if(id==='correction'){custom[id]={stage:3,kicker:'Correction approved',title:'Preparing the approved correction',intro:'Appraise is preparing a successor cycle. Previous results remain preserved.',body:'<div class="notice">No rerun has started. The corrected scope will require its applicable review and permission.</div>',actions:[],next:'Next: review the new run when preparation is complete.'};render(id);return}if(id==='latest'){custom[id]={...states.find(s=>s.id==='approach'),id,kicker:'Review · Version 3',body:'<h3>Updated scope</h3><p>Signed-in checkout now includes saved payment methods, including expired-card handling.</p><div class="notice">Your previous notes are retained: Check how expired saved cards are handled.</div>'};render(id);return}if(id==='checkunknown'){task.querySelector('#jw-feedback').textContent='Illustrative result: outcome still unknown. Another attempt remains blocked.';return}if(id==='decision'){root.querySelector('#jw-aux').hidden=false;root.querySelector('#jw-aux').textContent='Recorded closure: risks accepted for report version 1. Failed and inconclusive results remain unchanged. Sample data only.';return}if(id==='preparing'&&current==='scenarios'){const n=task.querySelectorAll('[data-scenario]:checked:not(:disabled)').length;const approved=task.querySelectorAll('[data-scenario]:disabled').length;if(n+approved<3){task.querySelector('#jw-feedback').textContent=`${n} selected decisions recorded in this preview. ${3-n-approved} remain; preparation has not started.`;task.querySelectorAll('[data-scenario]:checked').forEach(x=>{x.disabled=true;x.closest('.scenario').querySelector('label').textContent+=' · approved'});update();return}}render(id);}
