name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fallow quality gate
        run: npm run quality:fallow:ci

      - name: React Doctor
        run: npm run quality:react-doctor:ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx next build
