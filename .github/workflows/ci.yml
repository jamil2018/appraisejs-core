name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./e2e.db
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: node e2e/apply-migrations.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Fallow quality gate
        run: npm run quality:fallow:ci

      - name: React Doctor
        run: npm run quality:react-doctor:ci

      - name: Lint
        run: npm run lint

      - name: Unit validation
        run: npm run validate:unit

      - name: Build
        run: npm run build

      - name: E2E validation
        run: npm run validate:e2e
