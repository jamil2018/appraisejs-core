name: Release CI

on:
  push:
    branches: [main, appraise-0.5]
  pull_request:
    branches: [main, appraise-0.5]

permissions:
  contents: read

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  root-app:
    name: Root app
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./e2e.db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node e2e/apply-migrations.mjs
      - run: npm run lint
      - run: npm run validate:unit
      - run: npm run build

  appraisejs-package:
    name: appraisejs package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/appraisejs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/appraisejs/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  create-appraisejs-package:
    name: create-appraisejs package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/create-appraisejs/package-lock.json
      - run: npm ci
      - run: npm --prefix packages/create-appraisejs ci
      - run: npm --prefix packages/create-appraisejs test
      - run: npm --prefix packages/create-appraisejs run build

  security-and-quality:
    name: Security and quality ratchets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run release:check:local-boundary
      - run: npm run release:check:secrets
      - run: npm run release:check:mcp-http
      - run: npm run quality:fallow:release
      - run: npm run quality:ratchet -- --base "origin/${{ github.base_ref || 'appraise-0.5' }}"
      - run: npm run quality:react-doctor:ci

  dependency-and-package-content:
    name: Dependencies and package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm --prefix packages/appraisejs ci
      - run: npm --prefix packages/create-appraisejs ci
      - name: Audit production dependencies against the live registry
        run: |
          npm audit --omit=dev | tee audit-root.txt
          npm --prefix packages/appraisejs audit --omit=dev | tee audit-appraisejs.txt
          npm --prefix packages/create-appraisejs audit --omit=dev | tee audit-create-appraisejs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-dependency-audits
          path: audit-*.txt
      - run: npm run release:check:packages

  release-check:
    name: Release check
    if: always()
    needs:
      [root-app, appraisejs-package, create-appraisejs-package, security-and-quality, dependency-and-package-content]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release job
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.NEEDS_JSON); const failed=Object.entries(jobs).filter(([,job])=>job.result!=="success"); if(failed.length){console.error(failed.map(([name,job])=>`${name}: ${job.result}`).join("\n")); process.exit(1)}'
